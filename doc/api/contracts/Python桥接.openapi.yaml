openapi: 3.1.0
info:
  title: DSA Go/Python 内部桥接接口
  version: 1.0.0
  description: >-
    go-core 与 python_bridge 之间的内部网络契约，不是公共 API。
    除健康检查外，所有 POST 接口都需要鉴权：Python 端使用 X-Python-Bridge-Token，
    Go Core 端使用 X-Go-Core-Token。Go 个股分析请求在省略时默认
    search_news=true；调用方可显式传 false 关闭新闻搜索。
servers:
  - url: http://python-bridge:8090
security:
  - BridgeToken: []
paths:
  /healthz:
    get:
      servers:
        - url: http://python-bridge:8090
        - url: http://go-core:8088
      security: []
      summary: 检查任一内部服务是否存活
      responses:
        '200':
          description: 服务正在运行
  /ready:
    get:
      servers:
        - url: http://go-core:8088
      security: []
      summary: 检查 Go Core 就绪状态及 Python bridge 连通性
      responses:
        '200': {description: 服务已就绪}
        '503': {description: 依赖服务尚未就绪}
  /internal/v1/capabilities:
    get:
      servers:
        - url: http://go-core:8088
      security:
        - GoCoreToken: []
      summary: 列出 Go Core API 和工作流能力
      responses:
        '200': {description: 能力元数据}
        '401': {description: Go Core 访问令牌无效}
  /internal/v1/analysis/stock:
    post:
      servers:
        - url: http://go-core:8088
      security:
        - GoCoreToken: []
      summary: 单只股票分析兼容接口
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stock_code]
              properties:
                stock_code: {type: string, minLength: 1, maxLength: 32}
                query_id: {type: string, maxLength: 128}
                report_type: {type: string, default: detailed}
                as_of: {type: [string, 'null'], format: date-time}
                lookback_days: {type: integer, minimum: 0, maximum: 400, default: 60}
                notify: {type: boolean, default: false}
                search_news: {type: [boolean, 'null'], default: true}
                report_language: {type: string, enum: [zh, en, ko], default: zh}
      responses:
        '200': {description: 个股工作流结果与阶段跟踪信息}
        '401': {description: Invalid Go Core token}
        '422': {description: 个股分析请求无效}
        '502': {description: 工作流依赖调用失败}
  /internal/v1/analysis/stocks:
    post:
      servers:
        - url: http://go-core:8088
      security:
        - GoCoreToken: []
      summary: 按顺序批量分析股票，并分别返回每只股票的成功或失败结果
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stock_codes]
              properties:
                stock_codes:
                  type: array
                  minItems: 1
                  maxItems: 100
                  uniqueItems: true
                  items: {type: string, minLength: 1, maxLength: 32}
                query_id: {type: string, maxLength: 128}
                report_type: {type: string, default: detailed}
                as_of: {type: [string, 'null'], format: date-time}
                lookback_days: {type: integer, minimum: 0, maximum: 400, default: 60}
                notify: {type: boolean, default: false}
                search_news: {type: [boolean, 'null'], default: true}
                report_language: {type: string, enum: [zh, en, ko], default: zh}
      responses:
        '200': {description: 批量分析结果；单只股票失败信息放在 failures 字段}
        '401': {description: Invalid Go Core token}
        '422': {description: 批量分析请求无效}
  /internal/v1/analysis/market-review:
    post:
      servers:
        - url: http://go-core:8088
      security:
        - GoCoreToken: []
      summary: 执行由 Go 编排的区域市场复盘工作流
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                region: {type: string, enum: [cn, hk, us, jp, kr], default: cn}
                query_id: {type: string, maxLength: 128}
                as_of: {type: [string, 'null'], format: date-time}
                notify: {type: boolean, default: false}
                report_language: {type: string, enum: [zh, en, ko], default: zh}
      responses:
        '200': {description: 市场复盘结果与阶段跟踪信息}
        '401': {description: Invalid Go Core token}
        '422': {description: 请求参数无效}
        '502': {description: Workflow dependency failed}
  /internal/v1/market-data/stock-bundle:
    post:
      summary: 通过现有 Python 数据源获取个股原始数据包
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stock_code]
              properties:
                stock_code: {type: string, minLength: 1, maxLength: 32}
                lookback_days: {type: integer, minimum: 20, maximum: 400, default: 60}
                as_of: {type: [string, 'null'], format: date-time}
      responses:
        '200': {description: 个股数据包}
        '401': {description: Bridge 访问令牌无效}
        '502': {description: 数据源返回的载荷格式无效}
  /internal/v1/market-data/stock-auxiliary:
    post:
      summary: 获取旧版筹码、基本面和所属板块补充数据；历史时点请求会跳过仅支持最新快照的字段
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stock_code]
              properties:
                stock_code: {type: string, minLength: 1, maxLength: 32}
                lookback_days: {type: integer, minimum: 20, maximum: 400, default: 60}
                as_of: {type: [string, 'null'], format: date-time}
      responses:
        '200': {description: 可选辅助上下文与告警}
        '401': {description: Invalid bridge token}
        '503': {description: Python 对应能力当前不可用}
  /internal/v1/market-data/market-overview:
    post:
      summary: 获取最新标准化市场概览（旧适配器不支持历史时点快照）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                region: {type: string, enum: [cn, hk, us, jp, kr], default: cn}
                as_of: {type: [string, 'null'], format: date-time, description: 工作流参考时间；当前旧数据源只返回最新快照。}

      responses:
        '200': {description: 市场概览}
  /internal/v1/search/stock-news:
    post:
      summary: 搜索个股相关新闻
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stock_code]
              properties:
                stock_code: {type: string}
                stock_name: {type: string, default: ''}
                max_results: {type: integer, minimum: 1, maximum: 20, default: 8}
      responses:
        '200': {description: 新闻条目}
  /internal/v1/search/market-news:
    post:
      summary: 搜索区域市场新闻
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegionRequest'}
      responses:
        '200': {description: News items}
  /internal/v1/llm/analyze-stock:
    post:
      summary: 使用 Go 构建的上下文调用现有 Python 分析模型
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [context, query_id]
              properties:
                context: {type: object, additionalProperties: true}
                news_context: {type: string}
                report_type: {type: string, default: detailed}
                query_id: {type: string, minLength: 1, maxLength: 128}
                analysis_context_pack_summary: {type: string}
                report_language: {type: string, enum: [zh, en, ko], default: zh}
                search_performed: {type: boolean, default: false}
                news_result_count: {type: [integer, 'null'], minimum: 0}
                news_evidence_present: {type: boolean, default: false}
      responses:
        '200': {description: 结构化分析结果，包含旧版后处理与新闻证据元数据}
  /internal/v1/llm/generate-market-review:
    post:
      summary: 使用现有 Python 提示词和模型代码生成市场复盘文本
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [overview, region, query_id]
              properties:
                overview: {type: object, additionalProperties: true}
                news: {type: array, items: {type: object, additionalProperties: true}}
                region: {type: string, enum: [cn, hk, us, jp, kr]}
                query_id: {type: string}
                report_language: {type: string, default: zh}
      responses:
        '200': {description: Markdown 格式的市场复盘报告}
  /internal/v1/persistence/daily-bars:
    post:
      summary: 将标准化日 K 写入旧版 stock_daily 表
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stock_code, bars]
              properties:
                stock_code: {type: string, minLength: 1, maxLength: 32}
                source: {type: string, default: unknown}
                bars:
                  type: array
                  maxItems: 400
                  items:
                    type: object
                    required: [date, open, high, low, close, volume, amount]
                    properties:
                      date: {type: string, format: date}
                      open: {type: number, exclusiveMinimum: 0}
                      high: {type: number, exclusiveMinimum: 0}
                      low: {type: number, exclusiveMinimum: 0}
                      close: {type: number, exclusiveMinimum: 0}
                      volume: {type: number, minimum: 0}
                      amount: {type: number, minimum: 0}
                      pct_chg: {type: number, default: 0}
                      missing_fields:
                        type: array
                        items: {type: string, enum: [volume, amount, pct_chg]}
                        description: 数据源结果中缺失的可选字段必须保存为 SQL NULL，不得解释为 0。
      responses:
        '200': {description: 已持久化的行数}
        '401': {description: Invalid bridge token}
  /internal/v1/persistence/stock-analysis:
    post:
      summary: 通过现有 Python Repository 持久化由 Go 编排的个股分析结果
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result, context, query_id]
              properties:
                result: {type: object, additionalProperties: true}
                context: {type: object, additionalProperties: true}
                legacy_context: {type: object, additionalProperties: true}
                analysis_context_pack_summary: {type: string}
                report_type: {type: string, default: detailed}
                query_id: {type: string}
      responses:
        '200': {description: 已保存的历史记录 ID}
  /internal/v1/persistence/market-review:
    post:
      summary: 使用现有数据结构保存市场复盘历史
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [report, region, query_id]
              properties:
                report: {type: string}
                region: {type: string, enum: [cn, hk, us, jp, kr]}
                query_id: {type: string}
                overview: {type: object, additionalProperties: true}
      responses:
        '200': {description: Saved history ID}
  /internal/v1/notification/stock-analysis:
    post:
      summary: 发送个股分析通知
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result]
              properties:
                result: {type: object, additionalProperties: true}
                report_type: {type: string, default: detailed}
                query_id: {type: string}
                dedup_key: {type: string, maxLength: 256, description: 按股票区分的幂等键；同一批次中的不同股票代码不能使用相同键。}
      responses:
        '200': {description: 通知发送结果}
  /internal/v1/notification/market-review:
    post:
      summary: 发送市场复盘通知
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [report, query_id]
              properties:
                report: {type: string}
                region: {type: string, default: cn}
                query_id: {type: string}
      responses:
        '200': {description: Notification dispatch result}
components:
  securitySchemes:
    BridgeToken:
      type: apiKey
      in: header
      name: X-Python-Bridge-Token
    GoCoreToken:
      type: apiKey
      in: header
      name: X-Go-Core-Token
  schemas:
    RegionRequest:
      type: object
      required: [region]
      properties:
        region: {type: string, enum: [cn, hk, us, jp, kr], default: cn}
        as_of: {type: [string, 'null'], format: date-time, description: 可选的工作流参考时间；当前只有市场概览会将其作为元数据，因为底层数据源仅返回最新数据。}
