openapi: 3.0.3
info:
  title: News Data API
  version: 0.1.0-draft
  description: |
    新闻模块 API 草案。路由由根 stock-analysis-server:8092 统一注册；新闻模块不独立部署或实现认证，
    对外请求继承 Server 的认证与权限边界，内部 Application 调用不经过 HTTP。
    当前 Server 静态盘点未发现认证中间件；管理类路由在 Server 级认证/管理员授权落地前不得无保护开放。
    本文件仍为草案，不代表接口已经实现。
servers:
  - url: /
tags:
  - name: News
    description: 新闻查询与来源诊断
paths:
  /api/v1/news:
    get:
      tags: [News]
      summary: 查询已入库新闻
      operationId: listNews
      parameters:
        - name: from
          in: query
          description: 查询起始时间，时区和使用的时间字段须在契约冻结时明确
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: 查询结束时间，时区和使用的时间字段须在契约冻结时明确
          schema:
            type: string
            format: date-time
        - name: symbol
          in: query
          description: 规范化证券代码，例如 600519.SH；当前不假设存在统一 security_id
          schema:
            type: string
        - name: source_id
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: 查询成功；具体 envelope 待与现有 API 规范统一
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: 参数错误
        '401':
          description: 未授权
        '500':
          description: 服务内部错误
  /api/v1/news/search:
    post:
      tags: [News]
      summary: 搜索候选新闻
      operationId: searchNews
      description: 由根 Server 统一认证与授权；搜索默认只返回候选，不隐式入库。复杂查询参数放在请求体中，避免进入 URL 日志。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [q]
              properties:
                q:
                  type: string
                  minLength: 1
                from:
                  type: string
                  format: date-time
                to:
                  type: string
                  format: date-time
                persist:
                  type: boolean
                  default: false
      responses:
        '200':
          description: 搜索结果；部分 Provider 失败语义待冻结
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: 参数错误
        '500':
          description: 服务内部错误
  /api/v1/news/{id}:
    get:
      tags: [News]
      summary: 获取新闻详情
      operationId: getNews
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 新闻详情
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          description: 新闻不存在
  /api/v1/news/sources:
    get:
      tags: [News]
      summary: 查询新闻来源
      operationId: listNewsSources
      description: 来源目录查询由 Server 统一授权；任何来源写操作或主动采集操作均要求管理员权限，当前不定义新闻专属认证方案。
      responses:
        '200':
          description: 来源列表和状态
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/v1/news/diagnostics:
    get:
      tags: [News]
      summary: 查询新闻来源诊断
      operationId: getNewsDiagnostics
      description: 由 Server 统一授权；响应必须脱敏内部地址、密钥和敏感错误细节。
      responses:
        '200':
          description: 来源可用性和质量诊断
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
