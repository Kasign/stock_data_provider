        provider_returned: {type: integer, minimum: 0, description: Raw source rows received before A-share filtering and caller-limit truncation; paginated providers count rows received across pages}
        excluded_non_a_share_count: {type: integer, minimum: 0, description: Non-A-share source records excluded from normalized items}
        total_is_lower_bound: {type: boolean, description: True when a provider row cap prevents treating total as the authoritative full count}
        has_data: {type: boolean, description: False means unknown or unavailable, not a verified zero}
        items: {type: array, items: {$ref: '#/components/schemas/LimitPoolItem'}}
        source: {type: string}
        source_version: {type: string}
        fetched_at: {type: string, format: date-time}
        quality_status: {$ref: '#/components/schemas/QualityStatus'}
        quality_reasons: {type: array, items: {type: string}}
    ChipDistribution:
      type: object
      required: [symbol, average_cost, source, fetched_at, quality_status]
      properties:
        symbol: {type: string, example: 600519.SH}
        date: {type: string, format: date, nullable: true, description: Normalized chip snapshot date}
        average_cost: {type: number, exclusiveMinimum: 0, description: Average holder cost in CNY/share}
        cost_90_low: {type: number, nullable: true, description: Lower edge of the 90 percent cost band in CNY/share}
        cost_90_high: {type: number, nullable: true, description: Upper edge of the 90 percent cost band in CNY/share}
        cost_70_low: {type: number, nullable: true, description: Lower edge of the 70 percent cost band in CNY/share}
        cost_70_high: {type: number, nullable: true, description: Upper edge of the 70 percent cost band in CNY/share}
        source_version: {type: string}
        profit_ratio: {type: number, nullable: true, minimum: 0, maximum: 1, description: Profit ratio normalized to a 0–1 fraction}
        concentration_90: {type: number, nullable: true, minimum: 0, maximum: 1, description: 90 percent cost concentration normalized to a 0–1 fraction}
        concentration_70: {type: number, nullable: true, minimum: 0, maximum: 1, description: 70 percent cost concentration normalized to a 0–1 fraction}
        source: {type: string}
        provider_date: {type: string, nullable: true, description: Original provider report date}
        fetched_at: {type: string, format: date-time}
        quality_status: {$ref: '#/components/schemas/QualityStatus'}
        quality_reasons: {type: array, items: {type: string}}
    CapitalFlow:
      type: object
      required: [symbol, observations, source, fetched_at, quality_status]
      properties:
        symbol: {type: string, example: 600519.SH}
        provider_date: {type: string, format: date, description: Date of the latest provider observation; not an exact available timestamp}
        source_version: {type: string}
        main_net_inflow_yuan: {type: number, nullable: true, description: Provider-reported main net inflow in CNY yuan}
        inflow_5d_yuan: {type: number, nullable: true, description: Five-day net-inflow aggregate in CNY yuan when all required observations exist}
        inflow_10d_yuan: {type: number, nullable: true, description: Ten-day net-inflow aggregate in CNY yuan when all required observations exist}
        observations: {type: integer, minimum: 0, description: Number of observations used by the provider calculation}
        source: {type: string}
        fetched_at: {type: string, format: date-time}
        quality_status: {$ref: '#/components/schemas/QualityStatus'}
        quality_reasons: {type: array, items: {type: string}}
    ValuationItem:
      type: object
      required: [symbol, code, pe_ttm, pe_mrq, pe_static, pb_mrq, ps_ttm, pcf_ttm, source, fetched_at, quality_status]
      properties:
        symbol: {type: string, example: 600519.SH}
        code: {type: string, example: "600519"}
        name: {type: string}
        pe_ttm: {type: number, nullable: true, description: Price-to-earnings ratio on trailing twelve-month earnings; may be negative or null}
        pe_mrq: {type: number, nullable: true, description: Price-to-earnings ratio on most recent quarter basis; may be negative or null}
        pe_static: {type: number, nullable: true, description: Provider-native P/E based on net profit (for Tushare daily_basic pe); not equivalent to pe_mrq}
        pb_mrq: {type: number, nullable: true, description: Price-to-book ratio on most recent quarter basis; may be null}
        ps_ttm: {type: number, nullable: true, description: Price-to-sales ratio on trailing twelve-month basis; may be negative or null}
        pcf_ttm: {type: number, nullable: true, description: Price-to-cash-flow ratio on trailing twelve-month basis; may be negative or null}
        turnover_rate_percent: {type: number, nullable: true, description: Daily turnover rate in percentage points}
        float_turnover_rate_percent: {type: number, nullable: true, description: Daily free-float turnover rate in percentage points}
        volume_ratio: {type: number, nullable: true, description: Daily volume ratio; provider-native ratio, not a percentage}
        dividend_yield_percent: {type: number, nullable: true, description: Provider-reported dividend yield in percentage points}
        dividend_yield_ttm_percent: {type: number, nullable: true, description: Provider-reported trailing twelve-month dividend yield in percentage points}
        source: {type: string}
        source_version: {type: string}
        fetched_at: {type: string, format: date-time}
        quality_status: {$ref: '#/components/schemas/QualityStatus'}
        quality_reasons: {type: array, items: {type: string}}
    ValuationSnapshot:
      type: object
      required: [requested_symbols, total, items, source, fetched_at, quality_status]
      properties:
        requested_symbols:
          type: array
          items: {type: string, example: 600519.SH}
        total: {type: integer, minimum: 0, description: Number of returned valuation records}
        items: {type: array, items: {$ref: '#/components/schemas/ValuationItem'}}
        missing_symbols:
          type: array
          items: {type: string}
          description: Requested canonical symbols not returned by the provider; omitted when none
        provider_report_date:
          type: string
          format: date
          description: Trading/report date supplied by the provider; not an exact snapshot timestamp
        provider_timestamp:
          type: string
          format: date-time
          description: Latest valid provider time among the valuation metrics; does not mean each metric was updated at this time
        source: {type: string}
        source_version: {type: string}
        fetched_at: {type: string, format: date-time}
        quality_status: {$ref: '#/components/schemas/QualityStatus'}
        quality_reasons: {type: array, items: {type: string}}
    SourceStatus:
      type: object
      required: [name, enabled, quote_capable, daily_bar_capable]
      properties:
        name: {type: string}
        enabled: {type: boolean}
        quote_capable: {type: boolean}
        daily_bar_capable: {type: boolean}
        stock_basic_capable: {type: boolean}
        stock_search_capable: {type: boolean}
        sector_ranking_capable: {type: boolean}
        index_quote_capable: {type: boolean}
        index_catalog_capable: {type: boolean}
        historical_index_constituents_capable: {type: boolean, description: Provider explicitly supports historical constituent report-date queries}
        market_breadth_capable: {type: boolean}
        limit_pool_capable: {type: boolean}
        stock_boards_capable: {type: boolean}
        fundamentals_capable: {type: boolean}
        valuation_capable: {type: boolean}
        hot_ranking_capable: {type: boolean}
        announcements_capable: {type: boolean}
        dragon_tiger_capable: {type: boolean}
        trading_calendar_capable: {type: boolean}
        security_trading_status_capable: {type: boolean, description: Provider can return dated historical name and suspension evidence}
        chip_capable: {type: boolean}
        capital_flow_capable: {type: boolean}
    DataSourcesResponse:
      type: object
      required: [sources, normalization_version]
      properties:
        sources: {type: array, items: {$ref: '#/components/schemas/SourceStatus'}}
        normalization_version: {type: string}
security:
  - ApiKey: []
  - BearerAuth: []
paths:
  /health/live:
    get:
      security: []
      responses:
        '200': {description: Service process is live}
  /health/ready:
    get:
      security: []
      responses:
        '200': {description: Configured dependencies are ready}
        '503': {description: Configured dependencies are not ready}
  /api/v1/market/quotes:
    get:
      summary: 批量获取指定 A 股证券的实时行情
      description: 仅查询调用方明确提供的证券列表，不代表全市场扫描。最多 50 个不重复证券；部分证券失败时仍返回逐项结果和整体降级质量。
      security:
        - ApiKey: []
      parameters:
        - name: symbols
          in: query
          required: true
          description: 逗号分隔的 A 股代码，支持规范化后的六位代码或带交易所后缀代码。
          schema:
            type: string
            example: "600519.SH,000001.SZ"
      responses:
        '200':
          description: 行情批量结果；部分失败仍以逐项状态返回
          content:
            application/json:
              schema:
                type: object
                required: [items, total, succeeded, failed, fetched_at, quality_status]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [symbol, quality_status]
                      properties:
                        symbol: {type: string}
                        quote: {$ref: '#/components/schemas/Quote'}
                        error_code: {type: string, enum: [QUOTE_UNAVAILABLE]}
                        quality_status: {$ref: '#/components/schemas/QualityStatus'}
                  total: {type: integer}
                  succeeded: {type: integer}
                  failed: {type: integer}
                  fetched_at: {type: string, format: date-time}
                  quality_status: {$ref: '#/components/schemas/QualityStatus'}
        '400': {description: 证券列表缺失、重复、非法或超过 50 项}
        '401': {description: API key required}

  /api/v1/quotes/{symbol}:
    get:
      parameters:
        - {name: symbol, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Normalized real-time quote
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Quote'}
        '400': {description: Invalid symbol}
        '401': {description: API key required}
        '502': {description: All quote providers returned errors}
        '504': {description: All quote providers timed out}
  /api/v1/bars/{symbol}/daily:
    get:
      description: Without as_of, returns the current provider-selected series. With as_of, reads only locally recorded versions observed by that timestamp; it never calls live Providers or falls back to the current-value table.
      parameters:
        - {name: symbol, in: path, required: true, schema: {type: string}}
        - {name: start, in: query, schema: {type: string, format: date}}
        - {name: end, in: query, schema: {type: string, format: date}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 2000}}
        - {name: adjustment, in: query, schema: {$ref: '#/components/schemas/RequestAdjustmentBasis'}}
        - {name: as_of, in: query, schema: {type: string, format: date-time}, description: Optional RFC3339 system-observation cutoff; future timestamps are rejected}
      responses:
        '200':
          description: Daily bar collection; PIT responses include point_in_time and each selected bar's system_observed_at
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DailyBarsResponse'}
        '400': {description: Invalid symbol, date range, limit, adjustment or as_of timestamp}
        '401': {description: API key required}
        '404': {description: No coherent daily-bar revisions recorded by the requested as_of timestamp}
        '502': {description: All live Providers failed}
        '503': {description: No daily-bar Provider enabled for live reads, or PIT revision storage unavailable}
        '504': {description: All live Providers timed out}
  /api/v1/bundles/{symbol}:
    get:
      parameters:
        - {name: symbol, in: path, required: true, schema: {type: string}}
        - {name: lookback_days, in: query, schema: {type: integer, minimum: 20, maximum: 2000}}
        - {name: adjustment, in: query, schema: {$ref: '#/components/schemas/RequestAdjustmentBasis'}}
        - {name: as_of, in: query, description: RFC3339 cutoff time; latest quote is omitted for historical cutoffs, schema: {type: string, format: date-time}}
      responses:
        '200':
          description: Quote and daily-bar bundle with data quality metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Bundle'}
        '400': {description: Invalid symbol, date range or adjustment}
        '401': {description: API key required}
        '502': {description: Providers failed}
        '504': {description: Providers timed out}
  /api/v1/data-sources/probe:
    post:
      tags: [Data Sources]
      summary: 主动诊断 Provider 能力
      description: >-
        默认空请求体执行全部能力。scope=core 执行核心能力；capabilities 非空时仅执行指定能力。
        timeout_seconds 为单项 Provider 请求超时，范围 1 到 30 秒，默认 12 秒。
        探测与业务熔断统计隔离，并发上限为 4；敏感错误信息会脱敏。
      security:
        - ApiKey: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderProbeRequest'
            examples:
              core:
                summary: 核心能力诊断
                value: {scope: core, timeout_seconds: 12}
              selected:
                summary: 仅检查行情
                value: {scope: all, capabilities: [quote], timeout_seconds: 8}
      responses:
        '200':
          description: 诊断批次与各能力结果
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProviderProbeRun'}
        '400': {description: 请求参数或 JSON 格式无效}
        '401': {description: API Key 缺失或无效}
        '500': {description: 诊断结果持久化失败}
  /api/v1/data-sources/probe/history:
    get:
      summary: List recent persisted Provider probe runs
      parameters:
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: Recent sanitized probe runs
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProviderProbeHistory'}
        '400': {description: Invalid limit}
        '401': {description: API key required}
        '503': {description: Provider-probe history storage is unavailable}
  /api/v1/data-sources/diagnostics:
    get:
      tags: [Data Sources]
      summary: 查询数据源运行诊断
      description: 基于进程内真实行情与日 K 请求记录返回状态，不主动探测 Provider；服务重启后历史计数重置。
      security:
        - ApiKey: []
      responses:
        '200':
          description: Provider 运行诊断
          content:
            application/json:
              schema:
                type: object
                required: [items, scope, observed_from]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [provider, capabilities]
                      properties:
                        provider: {type: string}
                        capabilities:
                          type: array
                          items:
                            type: object
                            required: [capability, status, consecutive_failures, total_success, total_failure]
                            properties:
                              capability: {type: string, enum: [quote, daily_bars]}
                              status: {type: string, enum: [not_observed, healthy, degraded, open, half_open]}
                              consecutive_failures: {type: integer}
                              total_success: {type: integer, format: int64}
                              total_failure: {type: integer, format: int64}
                              last_success_at: {type: string, format: date-time, nullable: true}
                              last_failure_at: {type: string, format: date-time, nullable: true}
                              open_until: {type: string, format: date-time, nullable: true}
                  scope:
                    type: array
                    items: {type: string}
                  observed_from: {type: string, enum: [in_process_circuit_breaker]}
  /api/v1/data-sources:
    get:
      responses:
        '200':
          description: Registered data source capability status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DataSourcesResponse'}
        '401': {description: API key required}

  /api/v1/stocks/search:
    get:
      summary: 搜索 A 股证券名称或代码
      description: >-
        查询已启用的国内证券搜索 Provider。q 支持中文名称、六位代码或带市场后缀的标准代码；
        limit 控制返回条数，最多 50。结果是证券目录匹配候选，不是实时行情，fetched_at 不代表 quote_time。
        未知或降级质量必须由调用方按 quality_status 与 quality_reasons 处理。
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 64}, description: Chinese name, six-digit code or normalized symbol}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 50, default: 10}}
      responses:
        '200':
          description: Canonical A-share search candidates
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StockSearchSnapshot'}
        '400': {description: Empty/overlong query or invalid limit}
        '401': {description: API key required}
        '502': {description: All stock-search providers failed or returned invalid data}
        '503': {description: No stock-search provider enabled}

  /api/v1/stocks/{symbol}/announcements:
    get:
      summary: 获取单只 A 股指定日期区间内的公告
      description: >-
        查询东方财富公告列表。start_date/end_date 包含首尾，最多 366 天；缺省日期范围为中国时区最近 7 个日历日。
        announcement_date、published_at 与 fetched_at 分别表示源端公告日期、源端展示时间（可解析时）和采集时间。
        空列表为 quality unknown，不表示已证明该区间没有公告。公告能力独立配置，默认关闭。
      parameters:
        - {name: symbol, in: path, required: true, schema: {type: string, example: 600036.SH}}
        - {name: start_date, in: query, schema: {type: string, format: date}}
        - {name: end_date, in: query, schema: {type: string, format: date}}
        - {name: page, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        '200':
          description: Announcement page with source publication metadata and quality
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StockAnnouncementSnapshot'}
        '400': {description: Invalid symbol, date range or pagination}
        '401': {description: API key required}
        '502': {description: Provider unavailable or returned inconsistent data}
  /api/v1/stocks/{symbol}/profile:
    get:
      summary: Get single-security identity, listing metadata and current market-profile fields
      description: PE/PB, industry, market capitalization, ROE, margins and net profit come from Eastmoney quote fields. The upstream does not expose a verifiable timestamp for these fields, so profile quality is degraded; use quarterly fundamentals for report-period and publication-date semantics.
      parameters:
        - name: symbol
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Stock identity from the configured stock-basic provider
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StockBasic'}
        '400': {description: Invalid symbol}
        '401': {description: API key required}
        '502': {description: All stock-basic providers failed}
        '503': {description: No stock-basic provider enabled}
  /api/v1/stocks/{symbol}/price-limit-rule:
    get:
      summary: Resolve the effective A-share price-limit rule
      description: Combines historical security status, official rule tables and independently sourced special-event evidence. Missing status/event evidence returns an unknown rule and never assumes that no special event occurred.
      security:
        - ApiKey: []
      parameters:
        - {name: symbol, in: path, required: true, schema: {type: string}}
        - {name: date, in: query, required: true, schema: {type: string, format: date}, description: Historical exchange date in YYYY-MM-DD format; future dates are rejected}
      responses:
        '200':
          description: Price-limit rule result. Unknown status means the evidence is insufficient to use a limit percentage.
          content:
            application/json:
              schema:
                type: object
                required: [symbol, trade_date, status, quality_status, quality_reasons]
                properties:
                  symbol: {type: string}
                  market: {type: string}
                  board: {type: string}
                  trade_date: {type: string, format: date}
                  risk_warning_status: {type: string}
                  listing_trading_day_number: {type: integer}
                  listing_status_known: {type: boolean}
                  special_exception_status: {type: string}
                  special_exception_evidence: {$ref: '#/components/schemas/PriceLimitEventEvidence', nullable: true}
                  status: {type: string, enum: [unknown, limited, no_limit]}
                  limit_percent: {type: number, nullable: true, description: Percentage points; absent for unknown/no-limit rules}
                  no_limit_reason: {type: string}
                  rule_version: {type: string}
                  rule_effective_from: {type: string, format: date}
                  rule_effective_to: {type: string, format: date}
                  rule_source: {type: string}
                  rule_source_url: {type: string, format: uri}
                  quality_status: {$ref: '#/components/schemas/QualityStatus'}
                  quality_reasons: {type: array, items: {type: string}}
        '400': {description: Invalid symbol or trade date}
        '401': {description: API key required}
  /api/v1/stocks/{symbol}/trading-status:
    get:
      summary: Get historical trading-status evidence for one A-share
      description: Uses Tushare historical name-change, trading-calendar and suspension records to provide date-specific risk-warning, delisting and suspension evidence. Each source-content change is appended to local revision storage when MariaDB is enabled. Optional as_of reads only locally recorded versions known by that system timestamp and never falls back to live Providers. Missing or ambiguous evidence remains unknown; no-limit exception events are not inferred.
      security:
        - ApiKey: []
      parameters:
        - {name: symbol, in: path, required: true, schema: {type: string}}
        - {name: date, in: query, required: true, schema: {type: string, format: date}, description: Historical exchange date in YYYY-MM-DD format; future dates are rejected}
        - {name: as_of, in: query, required: false, schema: {type: string, format: date-time}, description: Optional system-observation cutoff. When supplied, reads only locally recorded revisions and never calls a live Provider.}
      responses:
        '200':
          description: Historical security status and quality metadata. Unknown status fields are valid response states when source evidence is incomplete.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SecurityTradingStatusSnapshot'}
        '400': {description: Invalid symbol, trade date or as_of timestamp}
        '401': {description: API key required}
        '404': {description: No usable status revision was recorded by the requested as_of timestamp}
        '502': {description: All configured security-status Providers failed for a live read}
        '503': {description: No security-trading-status Provider enabled, or local PIT revision storage unavailable}
  /api/v1/stocks/{symbol}/fundamentals:
    get:
      summary: Get quarterly indicators and financial statement sections
      description: >-
        Returns six groups of quarterly financial indicators and may also include selected income-statement,
        balance-sheet and cash-flow-statement line items when a configured provider supports them. Statement sections
        are not full upstream statements; missing fields remain absent and each section carries its own quality state.
        report_date is the financial period end; publication_date is the disclosure date of the selected provider
        revision. Income and cash-flow statement values use a single-quarter consolidated report where supported;
        balance-sheet values use the consolidated period-end report. Without as_of, the endpoint returns the latest
        usable provider result. With as_of, it only reads locally recorded revisions observed by that timestamp and
        never falls back to a live request. Since publication_time is not available for every metric, sections with a
        missing publication date or a publication date on/after the as_of date in Asia/Shanghai are excluded
        conservatively. Historical revisions can only be reconstructed for snapshots recorded after PIT storage began.
        Values preserve provider-native numeric scale and explicit units.
      parameters:
        - {name: symbol, in: path, required: true, schema: {type: string}}
        - {name: year, in: query, required: true, schema: {type: integer, minimum: 2007}}
        - {name: quarter, in: query, required: true, schema: {type: integer, minimum: 1, maximum: 4}}
        - {name: as_of, in: query, required: false, schema: {type: string, format: date-time}, description: Optional RFC3339 timestamp. Reads locally recorded versions known by this system timestamp; it does not call live Providers. Sections whose publication date cannot be proven to precede the Asia/Shanghai date of as_of are excluded.}
      responses:
        '200':
          description: Quarterly indicators and supported financial-statement sections; system_observed_at is included for PIT responses
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FundamentalsSnapshot'}
        '400': {description: Invalid symbol, report year, quarter or as_of timestamp}
        '401': {description: API key required}
        '404': {description: No usable financial revision was recorded by the requested as_of timestamp}
        '502': {description: Provider failed or returned invalid financial data}
        '503': {description: No fundamentals provider enabled for live reads, or PIT revision storage is unavailable}
  /api/v1/stocks/{symbol}/chip-distribution:
    get:
      summary: Get a stock chip-distribution snapshot
      description: >-
        Returns the latest provider-backed cost distribution for one A-share. Profit ratio and concentration values
        are normalized to fractions from 0 to 1 by the service. Missing optional values remain absent; the snapshot
        includes provider/source date, fetch time, source and quality reasons. This endpoint is not a prediction signal.
      parameters:
        - {name: symbol, in: path, required: true, schema: {type: string, example: 600519.SH}}
      responses:
        '200':
          description: Chip-distribution snapshot
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChipDistribution'}
        '400': {description: Invalid or unsupported symbol}
        '401': {description: API key required}
        '502': {description: All chip-distribution providers failed or returned invalid data}
        '503': {description: No chip-distribution provider enabled}
  /api/v1/stocks/{symbol}/capital-flow:
    get:
      summary: Get a stock capital-flow summary
      description: >-
        Amounts are CNY yuan. Main net inflow is the provider's reported observation, not a complete order-book audit.
        Five-day and ten-day aggregates are populated only when their required observations are available; missing
        values remain absent. provider_date is the newest observation date, not an exact availability timestamp. The snapshot includes observation count, source, fetch time and quality reasons.
      parameters:
        - {name: symbol, in: path, required: true, schema: {type: string, example: 600519.SH}}
      responses:
        '200':
          description: Capital-flow summary with CNY yuan amounts
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CapitalFlow'}
        '400': {description: Invalid or unsupported symbol}
        '401': {description: API key required}
        '502': {description: All capital-flow providers failed or returned invalid data}
        '503': {description: No capital-flow provider enabled}
  /api/v1/stocks/{symbol}/boards:
    get:
      summary: Get the boards associated with one A-share
      parameters:
        - {name: symbol, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Board membership snapshot; quality is degraded when the provider exposes no verifiable snapshot time
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StockBoardSnapshot'}
        '400': {description: Invalid symbol}
        '401': {description: API key required}
        '502': {description: All stock-boards providers failed or returned incomplete data}
        '503': {description: No stock-boards provider enabled}

  /api/v1/market/valuations:
    get:
      summary: Get valuation snapshots for up to 100 A-share symbols
      description: >-
        Returns provider-reported valuation ratios. Individual metrics can be null or negative; null is missing data, not zero.
        provider_timestamp is the latest valid provider timestamp among the valuation metrics and does not imply that every
        metric was updated at that exact time. The endpoint validates symbols, canonicalizes six-digit A-share codes and
        returns missing_symbols for requested symbols omitted by the provider.
      parameters:
        - name: symbols
          in: query
          required: true
          description: Comma-separated list of 1–100 six-digit A-share codes; SH/SZ/BJ suffixes are accepted and canonicalized.
          schema:
            type: string
            example: 600519.SH,000001.SZ
      responses:
        '200':
          description: Batch valuation snapshot with per-symbol and aggregate quality metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ValuationSnapshot'}
        '400': {description: Missing symbols, more than 100 raw entries, empty tokens, or invalid/B-share symbol}
        '401': {description: API key required}
        '502': {description: All valuation providers failed or returned invalid data}
        '503': {description: No valuation provider enabled}

  /api/v1/market/sectors:
    get:
      summary: Get live industry or concept board rankings
      parameters:
        - name: type
          in: query
          schema: {type: string, enum: [industry, concept], default: industry}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 10}
        - name: direction
          in: query
          description: Return the largest selected metric first (up) or the smallest first (down). change_5d is derived from six daily board-index closes; amount requires verified CNY values.
          schema: {type: string, enum: [up, down], default: up}
        - name: sort_by
          in: query
          required: false
          description: change_percent is today's change; amount is CNY turnover; change_5d is derived from six daily board-index closes.
          schema: {type: string, enum: [change_percent, amount, change_5d], default: change_percent}
      responses:
        '200':
          description: Current provider ranking snapshot with source and quality metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SectorRankingSnapshot'}
        '400': {description: Invalid sector type, sort_by, direction or limit}
        '401': {description: API key required}
        '502': {description: All sector-ranking providers failed}
        '503': {description: No sector-ranking provider enabled}

  /api/v1/market/index-catalog:
    get:
      summary: 获取同花顺或 Tushare 国内指数目录
      description: tag=tushare 返回 Tushare index_basic 目录；其他 tag 由兼容的同花顺 Provider 提供。Tushare 指数代码保留 .SH/.SZ/.CSI 后缀。
      security:
        - ApiKey: []
      parameters:
        - {name: tag, in: query, required: false, schema: {type: string, enum: [cn_concept, region, tszs, industry, tushare], default: cn_concept}}
      responses:
        '200':
          description: 指数/板块目录和来源质量
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IndexCatalogSnapshot'}
        '400': {description: Invalid index catalog tag}
        '401': {description: API key required}
        '502': {description: All index catalog providers failed}
        '503': {description: No index catalog provider enabled}

  /api/v1/market/indices/{symbol}/constituents:
    get:
      summary: 获取指定指数的最近或指定日期之前的成分权重报告快照
      description: 未提供 as_of 时保持原有当前/最近快照行为。提供 as_of 时只使用显式支持历史查询的 Provider；Tushare 返回不晚于请求日期的最新 index_weight 报告日。as_of_date 是请求日期，provider_report_date 是实际报告日。该接口不表示成分在报告日至下次报告日之间持续有效，也不是严格历史成员生效区间回放。
      security:
        - ApiKey: []
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
            example: "000300.SH"
        - name: source
          in: query
          required: false
          description: "指定来源；未提供时仅在具备相应能力的来源间选择"
          schema:
            type: string
            enum: [hithink, tushare]
        - name: as_of
          in: query
          required: false
          description: "返回不晚于该日期的最新历史权重报告；只支持 YYYY-MM-DD，不能替代成分生效区间"
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 指数成分股票目录及来源质量；历史查询同时返回 as_of_date 与 provider_report_date
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IndexConstituentSnapshot'}
        '400': {description: Invalid date or source does not support historical query}
        '401': {description: API key required}
        '502': {description: All index constituent providers failed}
        '503': {description: No index catalog provider enabled}

  /api/v1/market/indices/{symbol}/daily:
    get:
      summary: 获取指定指数的历史日线
      description: Tushare 日线成交量以手为单位，成交额按千元换算为人民币元。
      security:
        - ApiKey: []
      parameters:
        - {name: symbol, in: path, required: true, schema: {type: string, example: 000300.SH}}
        - {name: start, in: query, required: true, schema: {type: string, format: date}}
        - {name: end, in: query, required: true, schema: {type: string, format: date}}
        - {name: source, in: query, required: false, description: Pin the provider to the source returned by the index catalog; omitted means configured priority fallback, schema: {type: string, enum: [hithink, tushare]}}
      responses:
        '200':
          description: 指数历史日线及来源质量
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IndexDailyBarsSnapshot'}
        '400': {description: Invalid date range or index symbol}
        '401': {description: API key required}
        '502': {description: All index daily-bar providers failed}
        '503': {description: No index catalog provider enabled}

  /api/v1/market/indices:
    get:
      summary: Get quotes for an allow-listed set of core market indices
      security:
        - ApiKey: []
      responses:
        '200':
          description: Index quote snapshot with explicit source and quality metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IndexQuoteSnapshot'}
        '401': {description: API key required}
        '502': {description: All index-quote providers failed}
        '503': {description: No index-quote provider enabled}

  /api/v1/market/trading-calendar:
    get:
      summary: Get the explicit A-share trading calendar for an inclusive date range
      description: Returns one row for every calendar date, including weekends and holidays. The endpoint rejects missing date coverage and does not infer trading days from weekdays.
      parameters:
        - {name: start, in: query, required: true, schema: {type: string, format: date}}
        - {name: end, in: query, required: true, schema: {type: string, format: date}}
      responses:
        '200':
          description: Complete trading-calendar range and source quality metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TradingCalendarSnapshot'}
        '400': {description: Invalid or excessive date range}
        '401': {description: API key required}
        '502': {description: All trading-calendar providers failed or returned incomplete data}
        '503': {description: No trading-calendar provider enabled}
  /api/v1/market/session:
    get:
      summary: Get the scheduled A-share market session for a timestamp
      description: Uses the provider-backed trading calendar for the requested date and the standard Asia/Shanghai session schedule. It does not determine individual-stock suspension, security-specific price limits, or emergency exchange interruptions. When at is omitted, current server time is used.
      security:
        - ApiKey: []
      parameters:
        - {name: at, in: query, required: false, schema: {type: string, format: date-time}, description: Optional RFC3339 timestamp; response includes the Asia/Shanghai date and time}
      responses:
        '200':
          description: Scheduled market session, calendar source and quality metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MarketSessionSnapshot'}
        '400': {description: Invalid RFC3339 timestamp}
        '401': {description: API key required}
        '502': {description: Calendar provider failed or returned incomplete data}
        '503': {description: No trading-calendar provider enabled}
  /api/v1/market/stocks:
    get:
      summary: Get a paginated A-share market overview with quotes and optional moving averages
      description: >-
        Uses the validated A-share security directory as the universe and returns only the requested page. Quote
        coverage_ratio is scoped to that page. When include_ma=true, MA5 and MA20 are calculated from daily bars
        using the explicitly selected adjustment basis; unavailable or insufficient history remains null. Directory
        incompleteness is exposed through total_is_lower_bound and degraded quality rather than hidden.
      parameters:
        - {name: page, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 10000, default: 1}}
        - {name: page_size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {name: include_ma, in: query, required: false, schema: {type: boolean, default: true}}
        - {name: adjustment, in: query, required: false, schema: {$ref: '#/components/schemas/RequestAdjustmentBasis'}}
      responses:
        '200':
          description: One page of A-share overview records with per-item and aggregate quality metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MarketStocksSnapshot'}
        '400': {description: Invalid page, page_size, include_ma or adjustment}
        '401': {description: API key required}
        '502': {description: All complete-universe providers failed}
        '503': {description: No configured Provider exposes a complete A-share universe}
  /api/v1/market/capital-flow:
    get:
      summary: Get Tushare market-wide daily capital-flow history
      description: >-
        Returns the provider-reported market-wide moneyflow_mkt_dc series. Values are CNY and rates are percentage
        points. This is not calculated by summing a partial set of individual stocks. The endpoint requires a Tushare
        token with the moneyflow_mkt_dc permission (documented minimum 120 points); source timestamps are not precise,
        so the result remains degraded. The requested range is inclusive and capped at 2000 calendar days.
      security:
        - ApiKey: []
      parameters:
        - {name: start, in: query, required: true, schema: {type: string, format: date}}
        - {name: end, in: query, required: true, schema: {type: string, format: date}}
      responses:
        '200':
          description: Market-wide daily capital-flow history with explicit quality metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MarketCapitalFlowSnapshot'}
        '400': {description: Invalid date range}
        '401': {description: API key required}
        '502': {description: Market capital-flow provider failed or returned invalid data}
        '503': {description: No market capital-flow provider enabled}

  /api/v1/market/sentiment:
    get:
      summary: Get and persist the current A-share market sentiment snapshot
      description: >-
        Combines the market breadth snapshot with same-date limit-up, limit-down and broken-board pool counts.
        Missing or unverifiable pool counts remain null, never zero. A snapshot is persisted only when MariaDB storage
        is configured. Live collection is limited to the current China market date; historical dates are read-only.
      parameters:
        - {name: date, in: query, required: false, schema: {type: string, format: date}, description: Defaults to the current Asia/Shanghai date; only the current date can be collected}
      responses:
        '200':
          description: Market sentiment snapshot with source and quality metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MarketSentimentSnapshot'}
        '400': {description: Invalid or historical collection date}
        '401': {description: API key required}
        '502': {description: Market breadth provider failed}
  /api/v1/market/sentiment/history:
    get:
      summary: Get persisted daily A-share market sentiment snapshots
      parameters:
        - {name: start, in: query, required: true, schema: {type: string, format: date}}
        - {name: end, in: query, required: true, schema: {type: string, format: date}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 500, default: 366}}
      responses:
        '200':
          description: Persisted snapshots; missing trading dates are not synthesized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MarketSentimentHistory'}
        '400': {description: Invalid date range or limit}
        '401': {description: API key required}
        '503': {description: MariaDB history storage is unavailable}
  /api/v1/market/breadth:
    get:
      summary: Get Eastmoney A-share market-breadth distribution
      description: Aggregates Eastmoney market-wide change-distribution buckets and date-aligned limit-pool totals. total_securities is the sum of distribution bucket counts, not an independently verified security-master count. total_amount_cny is populated only when CLIST turnover pages are complete, contain valid unique securities with quote dates matching provider_report_date, and their coverage count matches the distribution total; otherwise it remains null and amount_coverage_count is zero. The multi-page collection is not an atomic snapshot, and the source exposes no verifiable intraday timestamp, so quality remains degraded.
      responses:
        '200':
          description: Market breadth including universe coverage and data quality
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MarketBreadthSnapshot'}
        '401': {description: API key required}
        '502': {description: Provider returned incomplete or invalid data}
        '503': {description: No market breadth provider enabled}
  /api/v1/market/hot-stocks:
    get:
      summary: Get domestic popularity, surge-proxy or follower ranking
      description: Eastmoney is preferred, Tonghuashun is the next optional fallback, and Xueqiu is an opt-in last fallback. Xueqiu surge uses the market-wide percentage-mover order as a proxy and is not equivalent to Eastmoney's hot-up list. Ranking data may be delayed, so successful snapshots remain degraded. total counts rows returned in this bounded response, not all securities in the market.
      parameters:
        - {name: type, in: query, required: false, schema: {type: string, enum: [popular, surge, followers], default: popular}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 10}}
      responses:
        '200':
          description: Bounded ranking snapshot with price enrichment and data-quality metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HotRankingSnapshot'}
        '400': {description: Invalid ranking type or limit}
        '401': {description: API key required}
        '502': {description: Provider returned invalid or unavailable data}
        '503': {description: No hot-ranking provider enabled}
  /api/v1/market/dragon-tiger:
    get:
      summary: 获取指定交易日龙虎榜盘后分页
      description: 金额为人民币元，涨跌幅和成交占比为百分点。源端未提供精确快照时间时保持 degraded；空报表为 unknown，不证明当日零上榜。
      parameters:
        - {name: date, in: query, required: false, description: 默认中国时区当日；盘后报告可能尚未发布, schema: {type: string, format: date}}
        - {name: page, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 1000, default: 1}}
        - {name: page_size, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
      responses:
        '200':
          description: 龙虎榜分页；has_data=false 时质量为 unknown
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DragonTigerSnapshot'}
        '400': {description: Invalid date or page parameters}
        '401': {description: API key required}
        '502': {description: Provider returned invalid or unavailable data}
  /api/v1/market/limit-pools:
    get:
      summary: Get limit-up, limit-down or broken-board pool
      parameters:
        - {name: type, in: query, schema: {type: string, enum: [up, down, broken], default: up}}
        - {name: date, in: query, description: Query date in Shanghai time, defaults to today's calendar date, schema: {type: string, format: date}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 30}}
      responses:
        '200':
          description: Pool snapshot; has_data=false is unknown/unavailable rather than a verified zero count
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LimitPoolSnapshot'}
        '400': {description: Invalid type, date or limit}
        '401': {description: API key required}
        '502': {description: Provider failed or returned invalid data}
        '503': {description: No limit-pool provider enabled}
