openapi: 3.0.3
info:
  title: Go Market Data Service
  version: 1.0.2
  description: >-
    A-share market-data API. Standard volume is shares; amount is CNY; prices are
    CNY/share. Provider event time, fetch time, normalization time, adjustment
    basis, source and quality metadata remain explicit.
servers:
  - url: http://market-data:8091
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
            request_id: {type: string}
    QualityStatus:
      type: string
      enum: [valid, degraded, stale, invalid, unknown]
    AdjustmentBasis:
      type: string
      enum: [none, forward_adjusted, backward_adjusted, unknown]
    RequestAdjustmentBasis:
      type: string
      description: unknown is a response state, not a valid request parameter.
      enum: [none, forward_adjusted, backward_adjusted]
    Quote:
      type: object
      required: [symbol, current_price, open, high, low, prev_close, volume, quote_time, fetched_at, normalized_at, source, volume_unit, amount_unit, adjustment_basis, quality_status, normalization_version]
      properties:
        symbol: {type: string, example: 600519.SH}
        name: {type: string}
        current_price: {type: number, nullable: true, description: CNY/share}
        change: {type: number, nullable: true, description: CNY/share}
        change_percent: {type: number, nullable: true, description: Percentage points; 1.25 means 1.25%}
        open: {type: number, nullable: true, description: CNY/share}
        high: {type: number, nullable: true, description: CNY/share}
        low: {type: number, nullable: true, description: CNY/share}
        prev_close: {type: number, nullable: true, description: CNY/share}
        volume: {type: integer, format: int64, nullable: true, description: Shares}
        amount: {type: number, nullable: true, description: CNY}
        volume_ratio: {type: number, nullable: true, description: Provider volume ratio; null when unsupported}
        turnover_rate: {type: number, nullable: true, description: Percentage points; 1.25 means 1.25%}
        quote_time: {type: string, format: date-time, nullable: true, description: Provider quote timestamp; never use fetch time as a replacement}
        quote_time_semantics: {type: string, description: Semantics of quote_time reported by the provider, e.g. provider_snapshot_time}
        fetched_at: {type: string, format: date-time}
        normalized_at: {type: string, format: date-time}
        source: {type: string}
        source_version: {type: string}
        request_id: {type: string}
        raw_volume: {type: number, nullable: true}
        raw_volume_unit: {type: string}
        raw_amount: {type: number, nullable: true}
        raw_amount_unit: {type: string}
        raw_amount_field: {type: string, description: Provider field used for the raw amount, for auditability}
        volume_unit: {type: string, enum: [shares]}
        amount_unit: {type: string, enum: [CNY]}
        adjustment_basis: {$ref: '#/components/schemas/AdjustmentBasis'}
        quality_status: {$ref: '#/components/schemas/QualityStatus'}
        quality_reasons: {type: array, items: {type: string}}
        fallback_from: {type: string}
        fallback_reason: {type: string}
        normalization_version: {type: string}
    DailyBar:
      type: object
      required: [symbol, trade_date, period, open, high, low, close, ma5, ma20, ma120, ma250, volume, adjustment_basis, source, fetched_at, normalized_at, volume_unit, amount_unit, quality_status, normalization_version]
      properties:
        symbol: {type: string}
        trade_date: {type: string, format: date}
        period: {type: string, enum: [1d]}
        is_partial: {type: boolean}
        open: {type: number, description: CNY/share}
        high: {type: number, description: CNY/share}
        low: {type: number, description: CNY/share}
        close: {type: number, description: CNY/share}
        ma5: {type: number, nullable: true, description: Mean close over the latest 5 trading sessions using the same adjustment basis; null when insufficient or invalid history}
        ma20: {type: number, nullable: true, description: Mean close over the latest 20 trading sessions using the same adjustment basis; null when insufficient or invalid history}
        ma120: {type: number, nullable: true, description: Mean close over the latest 120 trading sessions, an approximate half-year trading window; null when insufficient or invalid history}
        ma250: {type: number, nullable: true, description: Mean close over the latest 250 trading sessions, an approximate full-year trading window; null when insufficient or invalid history}
        volume: {type: integer, format: int64, nullable: true, description: Shares}
        amount: {type: number, nullable: true, description: CNY}
        change_percent: {type: number, nullable: true, description: Percentage points}
        adjustment_basis: {$ref: '#/components/schemas/AdjustmentBasis'}
        adjustment_reference_date: {type: string, format: date, description: Reference date used by the PIT adjustment-factor reconstruction}
        adjustment_method: {type: string, description: Adjustment algorithm identifier, for example cumulative_adj_factor_v1}
        adjustment_factor_source: {type: string, description: Provider used for the adjustment factor series}
        adjustment_factor_source_version: {type: string, description: Provider schema/data version used for the adjustment factor series}
        adjustment_factor_system_observed_at: {type: string, format: date-time, nullable: true, description: System observation time of the factor revision applied to this bar}
        source: {type: string}
        source_version: {type: string}
        provider_timestamp: {type: string, format: date-time, nullable: true}
        fetched_at: {type: string, format: date-time}
        normalized_at: {type: string, format: date-time}
        system_observed_at: {type: string, format: date-time, nullable: true, description: System record time of this revision; returned for as_of queries only}
        raw_volume: {type: number, nullable: true}
        raw_volume_unit: {type: string}
        raw_amount: {type: number, nullable: true}
        raw_amount_unit: {type: string}
        raw_amount_field: {type: string, description: Provider field used for the raw amount, for auditability}
        volume_unit: {type: string, enum: [shares]}
        amount_unit: {type: string, enum: [CNY]}
        quality_status: {$ref: '#/components/schemas/QualityStatus'}
        quality_reasons: {type: array, items: {type: string}}
        fallback_from: {type: string}
        fallback_reason: {type: string}
        request_id: {type: string}
        normalization_version: {type: string}
    DailyBarsResponse:
      type: object
      required: [symbol, period, adjustment_basis, volume_unit, amount_unit, quality_status, warnings, bars]
      properties:
        symbol: {type: string}
        period: {type: string, enum: [1d]}
        adjustment_basis: {$ref: '#/components/schemas/AdjustmentBasis'}
        volume_unit: {type: string, enum: [shares]}
        amount_unit: {type: string, enum: [CNY]}
        point_in_time: {type: boolean, description: True only when the response was reconstructed from revisions recorded by the requested as_of timestamp}
        as_of: {type: string, format: date-time, description: Requested system-observation cutoff for PIT queries}
        quality_status: {$ref: '#/components/schemas/QualityStatus'}
        warnings: {type: array, items: {type: string}}
        bars: {type: array, items: {$ref: '#/components/schemas/DailyBar'}}
    Bundle:
      type: object
      required: [symbol, daily_bars, sources, warnings, snapshot_id, analysis_reference_time, fetched_at, quality_status]
      properties:
        symbol: {type: string}
        name: {type: string}
        quote: {$ref: '#/components/schemas/Quote'}
        daily_bars: {type: array, items: {$ref: '#/components/schemas/DailyBar'}}
        sources:
          type: object
          additionalProperties: {type: string}
        warnings: {type: array, items: {type: string}}
        snapshot_id: {type: string}
        analysis_reference_time: {type: string, format: date-time}
        fetched_at: {type: string, format: date-time, description: Completion time after all bundle fetches have finished}
        quality_status: {$ref: '#/components/schemas/QualityStatus'}
    FundamentalMetric:
      type: object
      required: [key, name, value, unit, source_field]
      properties:
        key: {type: string}
        name: {type: string}
        value: {type: number}
        unit: {type: string}
        source_field: {type: string}
    FundamentalSection:
      type: object
      required: [category, has_data, metrics, quality_status]
      properties:
        category: {type: string, enum: [profitability, operating, growth, solvency, cash_flow, dupont, income_statement, balance_sheet, cash_flow_statement]}
        report_date: {type: string, format: date}
        publication_date: {type: string, format: date, description: Disclosure date for the selected provider revision; not an as_of historical revision selector}
        has_data: {type: boolean}
        metrics: {type: array, items: {$ref: '#/components/schemas/FundamentalMetric'}}
        quality_status: {$ref: '#/components/schemas/QualityStatus'}
        quality_reasons: {type: array, items: {type: string}}
    FundamentalsSnapshot:
      type: object
      required: [symbol, year, quarter, has_data, sections, source, fetched_at, quality_status]
      properties:
        symbol: {type: string}
        year: {type: integer}
        quarter: {type: integer, minimum: 1, maximum: 4}
        has_data: {type: boolean}
        sections: {type: array, items: {$ref: '#/components/schemas/FundamentalSection'}}
        source: {type: string}
        source_version: {type: string}
        fetched_at: {type: string, format: date-time}
        system_observed_at: {type: string, format: date-time, nullable: true, description: System recording time of the selected version, returned for as_of queries; not an upstream publication timestamp}
        quality_status: {$ref: '#/components/schemas/QualityStatus'}
        quality_reasons: {type: array, items: {type: string}}
    StockBoard:
      type: object
      required: [code, name, source, fetched_at, quality_status]
      properties:
        code: {type: string, description: Eastmoney board code, for example BK0477}
        name: {type: string}
        change_percent: {type: number, nullable: true, description: Percentage points, not a ratio}
        change_percent_5d: {type: number, nullable: true, description: Five-trading-session return derived from six daily closes; percentage points}
        source: {type: string}
        source_version: {type: string}
        provider_report_date: {type: string, format: date, description: Source report date; not an exact snapshot time}
        fetched_at: {type: string, format: date-time}
        quality_status: {$ref: '#/components/schemas/QualityStatus'}
        quality_reasons:
          type: array
          items: {type: string}
    StockBoardSnapshot:
      type: object
      required: [symbol, total, provider_returned, excluded_rows, total_is_lower_bound, has_data, items, source, fetched_at, quality_status]
      properties:
        symbol: {type: string}
        total: {type: integer, minimum: 0, description: Normalized board rows retained after filtering}
        provider_returned: {type: integer, minimum: 0, description: Raw source board rows received before normalization}
        excluded_rows: {type: integer, minimum: 0, description: Source rows explicitly excluded during normalization; currently zero when invalid/duplicate rows cause Provider fallback}
        total_is_lower_bound: {type: boolean, description: True when the Eastmoney response reaches its 1000-row request boundary and full coverage cannot be established}
        has_data: {type: boolean, description: False means the provider returned an ambiguous empty list, not confirmed zero memberships}
        items:
          type: array
          items: {$ref: '#/components/schemas/StockBoard'}
        source: {type: string}
        source_version: {type: string}
        fetched_at: {type: string, format: date-time}
        quality_status: {$ref: '#/components/schemas/QualityStatus'}
        quality_reasons:
          type: array
          items: {type: string}
    PriceLimitEventEvidence:
      type: object
      required: [symbol, status, effective_from, source, source_version, quality_status, source_url, observed_at, coverage_confirmed]
      properties:
        symbol: {type: string}
        status: {type: string, enum: [unknown, none, relisting_first_day, delisting_first_day, exchange_specified]}
        effective_from: {type: string, format: date}
        effective_to: {type: string, format: date}
        source: {type: string}
        source_version: {type: string}
        quality_status: {$ref: '#/components/schemas/QualityStatus'}
        quality_reasons: {type: array, items: {type: string}}
        source_url: {type: string, format: uri}
        announcement_id: {type: string}
        observed_at: {type: string, format: date-time}
        coverage_confirmed: {type: boolean, description: True only when the provider confirms complete coverage for a no-event result}
    SecurityTradingStatusSnapshot:
      type: object
      required: [symbol, trade_date, risk_warning_status, delisting_status, listing_status_known, is_trading_day, trading_day_known, suspension_status, source, source_version, fetched_at, quality_status]
      properties:
        symbol: {type: string}
        trade_date: {type: string, format: date}
        security_name: {type: string, description: Historical name effective on trade_date}
        name_effective_from: {type: string, format: date}
        name_effective_to: {type: string, format: date}
        risk_warning_status: {type: string, enum: [unknown, normal, risk_warning]}
        delisting_status: {type: string, enum: [unknown, normal, delisting_risk, delisting_period], description: Conservative historical-name classification; unknown does not imply normal}
        listing_date: {type: string, format: date}
        listing_trading_day_number: {type: integer, minimum: 0, description: One-based number of exchange trading sessions since listing when verifiable}
        listing_status_known: {type: boolean}
        is_trading_day: {type: boolean}
        trading_day_known: {type: boolean}
        suspension_status: {type: string, enum: [unknown, not_trading_day, no_suspension_event, suspended, intraday_suspension, resumed]}
        suspension_timing: {type: string, description: Provider suspension/resumption timing as reported}
        suspension_type: {type: string, description: Provider-native suspension type code or combined event codes}
        source: {type: string}
        source_version: {type: string}
        fetched_at: {type: string, format: date-time}
        system_observed_at: {type: string, format: date-time, nullable: true, description: System time when this source-content revision was recorded; present when local revision storage is enabled and the record time can be verified}
        quality_status: {$ref: '#/components/schemas/QualityStatus'}
        quality_reasons: {type: array, items: {type: string}}
    TradingCalendarDay:
      type: object
      required: [date, is_trading_day]
      properties:
        date: {type: string, format: date}
        is_trading_day: {type: boolean, description: Explicit provider flag; false is a non-trading day, not a missing row}
    TradingCalendarSnapshot:
      type: object
      required: [market, start_date, end_date, total_days, trading_days, items, source, fetched_at, quality_status]
      properties:
        market: {type: string, enum: [cn_a_share]}
        start_date: {type: string, format: date}
        end_date: {type: string, format: date}
        total_days: {type: integer, minimum: 1}
        trading_days: {type: integer, minimum: 0}
        items:
          type: array
          items: {$ref: '#/components/schemas/TradingCalendarDay'}
        source: {type: string}
        source_version: {type: string}
        fetched_at: {type: string, format: date-time}
        quality_status: {$ref: '#/components/schemas/QualityStatus'}
        quality_reasons:
          type: array
          items: {type: string}
    MarketSessionSnapshot:
      type: object
      required: [market, at, server_time, time_zone, local_date, local_time, is_trading_day, phase, is_trading_session, is_continuous_trading, is_auction, source, fetched_at, quality_status]
      properties:
        market: {type: string, enum: [cn_a_share]}
        at: {type: string, format: date-time, description: Requested instant, normalized to UTC in the response}
        server_time: {type: string, format: date-time, description: Actual server response-generation time in UTC; distinct from the requested at instant}
        time_zone: {type: string, enum: [Asia/Shanghai], description: Time zone used for local_date, local_time and session calculation}
        local_date: {type: string, format: date, description: Date in Asia/Shanghai}
        local_time: {type: string, description: Local clock time in Asia/Shanghai, HH:MM:SS}
        is_trading_day: {type: boolean, description: Determined by configured provider-backed trading calendar}
        phase: {type: string, enum: [non_trading_day, pre_open, opening_auction, auction_pause, continuous_morning, lunch_break, continuous_afternoon, closing_auction, closed]}
        is_trading_session: {type: boolean, description: True for opening auction, continuous sessions, and closing auction; false during breaks}
        is_continuous_trading: {type: boolean}
        is_auction: {type: boolean}
        source: {type: string, description: Trading-calendar provider used for the date classification}
        source_version: {type: string}
        fetched_at: {type: string, format: date-time}
        quality_status: {$ref: '#/components/schemas/QualityStatus'}
        quality_reasons: {type: array, items: {type: string}}
    StockAnnouncement:
      type: object
      required: [article_id, symbol, title, announcement_date, source, source_version, fetched_at, quality_status]
      properties:
        article_id: {type: string, description: Eastmoney art_code, unique within an announcement feed}
        symbol: {type: string}
        stock_name: {type: string}
        title: {type: string}
        title_chinese: {type: string}
        title_english: {type: string}
        category_code: {type: string}
        category: {type: string}
        announcement_date: {type: string, format: date, description: Source notice_date; separate from fetch time}
        published_at: {type: string, format: date-time, nullable: true, description: Parsed from source display_time only; absent when source supplies no exact time}
        display_time: {type: string, description: Original source display_time text}
        sort_date: {type: string, description: Original source ordering timestamp}
        ei_time: {type: string, description: Original Eastmoney eiTime metadata}
        language: {type: string}
        source_type: {type: string}
        source_url: {type: string, format: uri, description: Official article detail URL assembled from verified stock code and art_code}
        source: {type: string}
        source_version: {type: string}
        fetched_at: {type: string, format: date-time, description: Retrieval time; never used as announcement publishing time}
        quality_status: {$ref: '#/components/schemas/QualityStatus'}
        quality_reasons: {type: array, items: {type: string}}
    StockAnnouncementSnapshot:
      type: object
      required: [symbol, start_date, end_date, page, page_size, total, pages, returned, has_data, has_more, items, source, fetched_at, quality_status]
      properties:
        symbol: {type: string}
        start_date: {type: string, format: date}
        end_date: {type: string, format: date}
        page: {type: integer, minimum: 1}
        page_size: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, minimum: 0, description: Source-reported total hits across date range}
        pages: {type: integer, minimum: 0}
        returned: {type: integer, minimum: 0, description: Records on this page}
        has_data: {type: boolean, description: False plus quality unknown means source returned no records, not proof that no announcements exist}
        has_more: {type: boolean}
        items:
          type: array
          items: {$ref: '#/components/schemas/StockAnnouncement'}
        source: {type: string}
        source_version: {type: string}
        fetched_at: {type: string, format: date-time}
        quality_status: {$ref: '#/components/schemas/QualityStatus'}
        quality_reasons: {type: array, items: {type: string}}
    StockSearchItem:
      type: object
      required: [symbol, code, name, exchange]
      properties:
        symbol: {type: string, example: 600519.SH}
        code: {type: string, example: '600519'}
        name: {type: string, example: 贵州茅台}
        exchange: {type: string, enum: [SH, SZ, BJ]}
    StockSearchSnapshot:
      type: object
      required: [query, total, items, source, fetched_at, quality_status]
      properties:
        query: {type: string}
        total: {type: integer, minimum: 0, description: Number of matching candidates reported/retained by the selected Provider; not the total number of listed A-share securities}
        items: {type: array, items: {$ref: '#/components/schemas/StockSearchItem'}}
        source: {type: string}
        source_version: {type: string}
        fetched_at: {type: string, format: date-time, description: Time the market-data service fetched the stock directory result; not a quote timestamp}
        quality_status: {$ref: '#/components/schemas/QualityStatus'}
        quality_reasons: {type: array, items: {type: string}}
    StockBasic:
      type: object
      required: [symbol, name, security_type, security_type_label, listing_status, listing_status_label, source, fetched_at, quality_status, normalization_version]
      properties:
        symbol: {type: string}
        name: {type: string}
        ipo_date: {type: string, format: date}
        out_date: {type: string, format: date}
        security_type: {type: integer}
        security_type_label: {type: string}
        listing_status: {type: integer}
        listing_status_label: {type: string}
        pe_dynamic: {type: number, nullable: true, description: Dynamic price-to-earnings ratio; negative or missing values are preserved}
        pb: {type: number, nullable: true, description: Price-to-book ratio; may be missing}
        industry: {type: string, nullable: true}
        market_cap_cny: {type: number, nullable: true, description: Total market capitalization in CNY}
        float_market_cap_cny: {type: number, nullable: true, description: Floating market capitalization in CNY}
        total_shares: {type: number, nullable: true, description: Total share capital in shares, from Eastmoney f84; may be missing}
        float_shares: {type: number, nullable: true, description: Floating share capital in shares, from Eastmoney f85; may be missing or excluded if greater than total shares}
        board_code: {type: string, nullable: true, description: Eastmoney board code}
        roe_percent: {type: number, nullable: true, description: Return on equity in percentage points}
        net_profit_margin_percent: {type: number, nullable: true, description: Net profit margin in percentage points}
        net_profit_cny: {type: number, nullable: true, description: Net profit amount in CNY as reported by the current market-profile endpoint}
        gross_margin_percent: {type: number, nullable: true, description: Gross margin in percentage points}
        source: {type: string}
        source_version: {type: string}
        fetched_at: {type: string, format: date-time}
        quality_status: {$ref: '#/components/schemas/QualityStatus'}
        quality_reasons: {type: array, items: {type: string}}
        normalization_version: {type: string}
    SectorRanking:
      type: object
      required: [rank, code, name, category, amount_unit, source, fetched_at, quality_status]
      properties:
        rank: {type: integer}
        code: {type: string}
        name: {type: string}
        category: {type: string, enum: [industry, concept]}
        latest_price: {type: number, nullable: true}
        change: {type: number, nullable: true}
        change_percent: {type: number, nullable: true, description: Percentage points, not a ratio}
        amount: {type: number, nullable: true}
        amount_unit: {type: string, enum: [CNY, unknown]}
        advancing_count: {type: integer, nullable: true}
        declining_count: {type: integer, nullable: true}
        leading_stock: {type: string}
        leader_change_percent: {type: number, nullable: true}
        source: {type: string}
        source_version: {type: string}
        fetched_at: {type: string, format: date-time}
        quality_status: {$ref: '#/components/schemas/QualityStatus'}
        quality_reasons:
          type: array
          items: {type: string}
    SectorRankingSnapshot:
      type: object
      required: [category, direction, total, items, source, fetched_at, quality_status]
      properties:
        category: {type: string, enum: [industry, concept]}
        direction: {type: string, enum: [up, down]}
        sort_by: {type: string, enum: [change_percent, amount, change_5d]}
        total: {type: integer, minimum: 0, description: Source-reported sector count or best available count; only a lower bound when total_is_lower_bound is true}
        provider_returned: {type: integer, minimum: 0, description: Raw CLIST rows or SW1 industry universes received before caller-limit truncation}
        excluded_rows: {type: integer, minimum: 0, description: Source ranking rows omitted due to invalid required fields or no usable constituent quote changes}
        total_is_lower_bound: {type: boolean, description: True when source total is absent and only the normalized returned count is known}
        items:
          type: array
          items: {$ref: '#/components/schemas/SectorRanking'}
        source: {type: string}
        source_version: {type: string}
        provider_report_date: {type: string, format: date}
        fetched_at: {type: string, format: date-time}
        quality_status: {$ref: '#/components/schemas/QualityStatus'}
        quality_reasons:
          type: array
          items: {type: string}
    MarketIndexQuote:
      type: object
      required: [symbol, code, name, amount_unit, source, fetched_at, quality_status]
      properties:
        symbol: {type: string, description: Allow-listed index symbol, not normalized as an equity symbol}
        code: {type: string}
        name: {type: string}
        latest_price: {type: number, nullable: true}
        change: {type: number, nullable: true}
        change_percent: {type: number, nullable: true, description: Percentage points, not a ratio}
        open: {type: number, nullable: true}
        high: {type: number, nullable: true}
        low: {type: number, nullable: true}
        prev_close: {type: number, nullable: true}
        amount: {type: number, nullable: true}
        amount_unit: {type: string, enum: [CNY, unknown]}
        quote_time: {type: string, format: date-time, nullable: true}
        quote_time_semantics: {type: string}
        source: {type: string}
        source_version: {type: string}
        fetched_at: {type: string, format: date-time}
