name: Quant module validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'internal/quant/**'
      - 'doc/quant/**'
      - '.github/workflows/quant-test.yml'
      - 'go.mod'
      - 'go.sum'
  push:
    branches: [feat/quant, repair_all]
    paths:
      - 'internal/quant/**'
      - 'doc/quant/**'
      - '.github/workflows/quant-test.yml'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

concurrency:
  group: quant-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quant:
    name: Test Quant packages
    runs-on: ubuntu-latest
    env:
      QUANT_TEST_MYSQL_DSN: root:quant-test-root@tcp(127.0.0.1:3306)/quant_test?parseTime=true&multiStatements=true
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: quant-test-root
          MARIADB_DATABASE: quant_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: go.sum
      - name: 检查 Quant 代码格式
        shell: bash
        run: |
          files="$(find internal/quant -name '*.go' -type f -print0 | xargs -0 gofmt -l)"
          if [[ -n "$files" ]]; then
            echo "::error::Quant Go 文件未通过 gofmt"
            printf '%s\\n' "$files"
            while IFS= read -r file; do gofmt -d "$file"; done <<< "$files"
            exit 1
          fi
      - name: 下载依赖
        run: go mod download
      - name: 运行 Quant 单元与 MariaDB 集成测试
        run: go test ./internal/quant/...
      - name: 验证不可变结果 MariaDB 用例未跳过
        run: go test -v -run '^TestMySQL(Repository|AccessAuditor|ResultAccessPolicy)' ./internal/quant/storage
      - name: 运行 Manifest 指纹随机 Fuzz
        run: go test -run=^$ -fuzz=FuzzFingerprintPayloadNoPanic -fuzztime=30s ./internal/quant/manifest
      - name: 运行 Quant 竞态检测
        run: go test -race ./internal/quant/...
      - name: 运行 Quant 静态检查
        run: go vet ./internal/quant/...
