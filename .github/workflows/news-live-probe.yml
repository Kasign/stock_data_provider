name: News live Provider and Feed probe

on:
  push:
    branches:
      - integration
  workflow_dispatch:
    inputs:
      confirm_live_probe:
        description: "确认使用已配置的真实 Provider 凭证和已授权 Feed URL 发起在线请求"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: news-live-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-probe:
    if: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[run_news_live_probe]')) || (github.event_name == 'workflow_dispatch' && inputs.confirm_live_probe) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEWS_LIVE_PROBE: "1"
      NEWS_LIVE_QUERY: ${{ vars.NEWS_LIVE_QUERY }}
      NEWS_PROVIDER_BOCHA_ENDPOINT: ${{ vars.NEWS_PROVIDER_BOCHA_ENDPOINT }}
      NEWS_PROVIDER_BOCHA_API_KEY: ${{ secrets.NEWS_PROVIDER_BOCHA_API_KEY }}
      NEWS_PROVIDER_TAVILY_ENDPOINT: ${{ vars.NEWS_PROVIDER_TAVILY_ENDPOINT }}
      NEWS_PROVIDER_TAVILY_API_KEY: ${{ secrets.NEWS_PROVIDER_TAVILY_API_KEY }}
      NEWS_PROVIDER_BRAVE_ENDPOINT: ${{ vars.NEWS_PROVIDER_BRAVE_ENDPOINT }}
      NEWS_PROVIDER_BRAVE_API_KEY: ${{ secrets.NEWS_PROVIDER_BRAVE_API_KEY }}
      NEWS_PROVIDER_SEARXNG_ENDPOINT: ${{ vars.NEWS_PROVIDER_SEARXNG_ENDPOINT }}
      NEWS_LIVE_FEED_URL: ${{ vars.NEWS_LIVE_FEED_URL }}
      NEWS_LIVE_FEED_AUTHORIZATION_EVIDENCE: ${{ vars.NEWS_LIVE_FEED_AUTHORIZATION_EVIDENCE }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
          cache-dependency-path: go.sum
      - name: Download dependencies
        run: go mod download
      - name: Require at least one configured News Provider
        shell: bash
        run: |
          if [[ -n "$NEWS_PROVIDER_BOCHA_ENDPOINT" && -n "$NEWS_PROVIDER_BOCHA_API_KEY" ]] || \
             [[ -n "$NEWS_PROVIDER_TAVILY_ENDPOINT" && -n "$NEWS_PROVIDER_TAVILY_API_KEY" ]] || \
             [[ -n "$NEWS_PROVIDER_BRAVE_ENDPOINT" && -n "$NEWS_PROVIDER_BRAVE_API_KEY" ]] || \
             [[ -n "$NEWS_PROVIDER_SEARXNG_ENDPOINT" ]]; then
            echo "检测到至少一个完整配置的 News Provider。"
          else
            echo "::error::未配置完整的 NEWS_PROVIDER_* Provider；本次 Live Probe 不会产生有效验收证据。"
            exit 1
          fi
      - name: Probe configured real Providers
        run: go test ./internal/news/adapters/provider -run '^TestLiveProviderProbe$' -count=1 -v
      - name: Probe explicitly authorized RSS/Atom Feed
        run: go test ./internal/news/adapters/source -run '^TestLiveFeedProbe$' -count=1 -v
