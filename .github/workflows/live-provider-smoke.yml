name: Live provider probe

on:
  push:
    branches:
      - feat/full-go-data-providers-api-switch
    paths:
      - ".github/workflows/live-provider-smoke.yml"
      - "internal/marketdata/**"
      - "configs/**"
      - ".env.example"
      - "go.mod"
      - "go.sum"
  pull_request:
    paths:
      - ".github/workflows/live-provider-smoke.yml"
      - "internal/marketdata/**"
      - "configs/**"
      - ".env.example"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:
    inputs:
      quote_symbol:
        description: "A-share symbol for real-time quote probes"
        required: false
        default: "600519.SH"
        type: string
      daily_symbol:
        description: "A-share symbol for daily-bar probes"
        required: false
        default: "600036.SH"
        type: string
      include_mx:
        description: "Run quota-sensitive MX API probes"
        required: false
        default: false
        type: boolean
      include_netease:
        description: "Run optional NetEase probes"
        required: false
        default: false
        type: boolean
      include_hithink:
        description: "Run Hithink probes when its API key is configured"
        required: false
        default: false
        type: boolean
      include_tushare:
        description: "Run Tushare probes when its token is configured"
        required: false
        default: false
        type: boolean
      include_tickflow:
        description: "Run TickFlow probes when its API key is configured"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  live-provider-probe:
    name: Probe real public provider responses
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Provider networks may rate-limit or block hosted runners; live diagnostics do not gate regular CI.
    continue-on-error: true
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: market-data-ci
          MARIADB_DATABASE: market_data_probe
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Probe public market-data providers
        env:
          MARKET_DATA_LIVE_PROVIDER_TESTS: ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[include_public]'))) && '1' || '0' }}
          MARKET_DATA_LIVE_PUBLIC_DAILY_ONLY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[public_daily_only]') && '1' || '0' }}
          MARKET_DATA_LIVE_PUBLIC_ADJUSTED: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[historical_adjusted_2025]') && '1' || '0' }}
          LIVE_PROVIDER_REPORT_PATH: ${{ github.workspace }}/live-provider-report.json
          LIVE_PROBE_QUOTE_SYMBOL: ${{ github.event.inputs.quote_symbol || '600519.SH' }}
          LIVE_PROBE_DAILY_SYMBOL: ${{ github.event.inputs.daily_symbol || '600036.SH' }}
          LIVE_PROBE_DAILY_SYMBOLS: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[historical_daily_both]')) && '600036.SH,002982.SZ' || '' }}
          LIVE_PROBE_DAILY_START_DATE: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[historical_daily_2025]')) && '2025-07-07' || '' }}
          LIVE_PROBE_DAILY_END_DATE: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[historical_daily_2025]')) && '2025-07-17' || '' }}
          MARKET_DATA_LIVE_MX_TESTS: ${{ ((github.event_name == 'workflow_dispatch' && inputs.include_mx) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[include_mx]'))) && '1' || '0' }}
          MARKET_DATA_LIVE_NETEASE_TESTS: ${{ ((github.event_name == 'workflow_dispatch' && inputs.include_netease) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[include_netease]'))) && '1' || '0' }}
          MARKET_DATA_LIVE_HITHINK_TESTS: ${{ ((github.event_name == 'workflow_dispatch' && inputs.include_hithink) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[include_hithink]'))) && '1' || '0' }}
          MARKET_DATA_LIVE_TUSHARE_TESTS: ${{ ((github.event_name == 'workflow_dispatch' && inputs.include_tushare) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[include_tushare]'))) && '1' || '0' }}
          MARKET_DATA_LIVE_TICKFLOW_TESTS: ${{ ((github.event_name == 'workflow_dispatch' && inputs.include_tickflow) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[include_tickflow]'))) && '1' || '0' }}
          MARKET_DATA_LIVE_TICKFLOW_INDEX_ONLY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[tickflow_index_only]') && '1' || '0' }}
          MARKET_DATA_LIVE_TICKFLOW_QUOTE_ONLY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[tickflow_quote_only]') && '1' || '0' }}
          MARKET_DATA_LIVE_TICKFLOW_DAILY_ONLY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[tickflow_daily_only]') && '1' || '0' }}
          MARKET_DATA_LIVE_TUSHARE_DAILY_ONLY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[tushare_daily_only]') && '1' || '0' }}
          MARKET_DATA_LIVE_HITHINK_DAILY_ONLY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[hithink_daily_only]') && '1' || '0' }}
          MARKET_DATA_TICKFLOW_API_KEY: ${{ secrets.TICKFLOW_API_KEY }}
          MARKET_DATA_TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          MARKET_DATA_HITHINK_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
          MARKET_DATA_HITHINK_BASE_URL: https://fuyao.aicubes.cn
          MARKET_DATA_MX_API_KEY: ${{ secrets.MX_APIKEY }}
          MARKET_DATA_MX_API_URL: https://mkapi2.dfcfs.com/finskillshub/api/claw/query
        run: go test -run '^TestLiveProviderProbe$|^TestLiveProviderProbeQuarterlyFundamentals$|^TestLiveHithinkCapabilities$|^TestLiveTushareCapabilities$|^TestLiveTickFlowCapabilities$' -count=1 -v ./internal/marketdata/provider
      - name: Probe Hithink 2025 annual balance-sheet publication-date raw fields
        if: always() && github.event_name == 'push' && contains(github.event.head_commit.message, '[hithink_balance_sheet_raw]')
        env:
          MARKET_DATA_LIVE_HITHINK_BALANCE_SHEET_RAW: "1"
          MARKET_DATA_HITHINK_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
          MARKET_DATA_HITHINK_BASE_URL: https://fuyao.aicubes.cn
        run: go test -run TestLiveHithinkAnnualBalanceSheetPublicationDateRaw -count=1 -v ./internal/marketdata/provider
      - name: Probe Hithink DailyBar single-window adjustment modes
        if: always() && github.event_name == 'push' && contains(github.event.head_commit.message, '[hithink_daily_bars_single_window]')
        env:
          MARKET_DATA_LIVE_HITHINK_DAILY_BARS_SINGLE_WINDOW: "1"
          MARKET_DATA_HITHINK_API_KEY: ${{ secrets.HITHINK_FINANCE_API_KEY }}
          MARKET_DATA_HITHINK_BASE_URL: https://fuyao.aicubes.cn
        run: go test -run TestLiveHithinkDailyBarsSingleWindow -count=1 -v ./internal/marketdata/provider
      - name: Probe historical Provider service and MariaDB persistence
        if: always() && github.event_name == 'push' && contains(github.event.head_commit.message, '[historical_service_probe]')
        env:
          MARKET_DATA_LIVE_HISTORICAL_PROBE: "1"
          LIVE_HISTORICAL_PROBE_REPORT_PATH: ${{ github.workspace }}/live-historical-probe-report.json
          MARKET_DATA_TEST_MYSQL_DSN: "root:market-data-ci@tcp(127.0.0.1:3306)/market_data_probe?parseTime=true&loc=UTC"
          MARKET_DATA_TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
        run: go test -run TestLiveHistoricalProviderProbe -count=1 -v ./internal/marketdata/service
      - name: Probe BaoStock historical adjustment-factor consistency
        if: always() && github.event_name == 'push' && contains(github.event.head_commit.message, '[historical_baostock_factors]')
        env:
          MARKET_DATA_LIVE_BAOSTOCK_ADJUSTMENT_TESTS: "1"
          LIVE_BAOSTOCK_ADJUSTMENT_REPORT_PATH: ${{ github.workspace }}/live-baostock-adjustment-report.json
        run: go test -run TestLiveBaoStockAdjustmentFactorConsistency -count=1 -v ./internal/marketdata/baostock
      - name: Probe Tushare historical adjustment factors and corporate actions
        if: always() && github.event_name == 'push' && contains(github.event.head_commit.message, '[historical_tushare_adjustment]')
        env:
          MARKET_DATA_LIVE_TUSHARE_ADJUSTMENT_TESTS: "1"
          MARKET_DATA_TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          LIVE_PROBE_DAILY_START_DATE: "2025-07-07"
          LIVE_PROBE_DAILY_END_DATE: "2025-07-17"
          LIVE_PROBE_DAILY_SYMBOLS: "600036.SH,002982.SZ"
          LIVE_TUSHARE_ADJUSTMENT_REPORT_PATH: ${{ github.workspace }}/live-tushare-adjustment-report.json
        run: go test -run TestLiveTushareHistoricalAdjustmentEvidence -count=1 -v ./internal/marketdata/provider
      - name: Probe Pytdx historical daily bars and corporate actions
        if: always() && github.event_name == 'push' && contains(github.event.head_commit.message, '[historical_pytdx_gbbq]')
        env:
          MARKET_DATA_LIVE_PYTDX_HISTORICAL_TESTS: "1"
          LIVE_PROBE_DAILY_START_DATE: "2025-07-07"
          LIVE_PROBE_DAILY_END_DATE: "2025-07-17"
          LIVE_PROBE_DAILY_SYMBOLS: "600036.SH,002982.SZ"
          LIVE_PYTDX_HISTORICAL_REPORT_PATH: ${{ github.workspace }}/live-pytdx-historical-report.json
          LIVE_PYTDX_BAOSTOCK_EVENT_REPORT_PATH: ${{ github.workspace }}/live-pytdx-baostock-event-report.json
        run: go test -run 'TestLivePytdxHistoricalDailyBars|TestLivePytdxBaoStockCorporateActionConsistency' -count=1 -v ./internal/marketdata/provider
      - name: Probe Tushare intraday suspension samples
        if: always() && github.event_name == 'push' && contains(github.event.head_commit.message, '[historical_tushare_suspension]')
        env:
          MARKET_DATA_LIVE_TUSHARE_SUSPENSION_TESTS: "1"
          MARKET_DATA_TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          LIVE_TUSHARE_SUSPENSION_REPORT_PATH: ${{ github.workspace }}/live-tushare-suspension-report.json
        run: go test -run '^TestLiveTushareIntradaySuspensionSamples$' -count=1 -v ./internal/marketdata/provider
      - name: Probe Pytdx daily bars on official intraday-suspension dates
        if: always() && github.event_name == 'push' && contains(github.event.head_commit.message, '[historical_intraday_daily_bars]')
        env:
          MARKET_DATA_LIVE_PYTDX_OFFICIAL_SUSPENSION_TESTS: "1"
          LIVE_PYTDX_OFFICIAL_SUSPENSION_REPORT_PATH: ${{ github.workspace }}/live-pytdx-official-suspension-report.json
        run: go test -run '^TestLivePytdxOfficialIntradaySuspensionDailyBars$' -count=1 -v ./internal/marketdata/provider
      - name: Upload sanitized live Provider reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-provider-reports
          path: |
            live-provider-report.json
            live-historical-probe-report.json
            live-baostock-adjustment-report.json
            live-tushare-adjustment-report.json
            live-pytdx-historical-report.json
            live-pytdx-baostock-event-report.json
            live-tushare-suspension-report.json
            live-pytdx-official-suspension-report.json
          if-no-files-found: ignore
