name: Go-Python data quality parity

on:
  workflow_dispatch:
  push:
    branches:
      - feat/full-go-data-providers-api-switch
    paths:
      - 'internal/marketdata/normalize/**'
      - 'python_bridge/capabilities/market_data.py'
      - 'scripts/compare_market_data_exports.py'
      - 'scripts/test_compare_market_data_exports.py'
      - 'doc/api/provider-migration/PYTHON_PROVIDER_GO_MIGRATION_MATRIX.md'
      - 'doc/api/provider-migration/GO_PYTHON_DATA_QUALITY_PARITY_REPORT.md'
      - '.github/workflows/data-quality-parity.yml'
  pull_request:
    paths:
      - 'internal/marketdata/normalize/**'
      - 'python_bridge/capabilities/market_data.py'
      - 'scripts/compare_market_data_exports.py'
      - 'scripts/test_compare_market_data_exports.py'
      - 'doc/api/provider-migration/PYTHON_PROVIDER_GO_MIGRATION_MATRIX.md'
      - 'doc/api/provider-migration/GO_PYTHON_DATA_QUALITY_PARITY_REPORT.md'
      - '.github/workflows/data-quality-parity.yml'

permissions:
  contents: read

concurrency:
  group: data-quality-parity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-contract:
    name: Data quality contract regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: go.sum

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test Python and Go sample comparison utility
        run: python -m unittest scripts/test_compare_market_data_exports.py -v

      - name: Run Python-to-Go parity contract tests
        run: go test ./internal/marketdata/normalize -run TestLegacyPythonBridgeAndGoQualityContract -count=1 -v

      - name: Run market-data Go tests
        run: go test ./internal/marketdata/...

      - name: Verify legacy Python quality markers and report
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'legacy_provider_unit_contract_unverified' python_bridge/capabilities/market_data.py
          grep -q 'adjustment_basis_unverified' python_bridge/capabilities/market_data.py
          grep -q '必须保留的 Go 数据质量与单位统一改进' doc/api/provider-migration/GO_PYTHON_DATA_QUALITY_PARITY_REPORT.md
          grep -q '不得为了追求与旧 Python 返回值表面一致' doc/api/provider-migration/GO_PYTHON_DATA_QUALITY_PARITY_REPORT.md
          grep -q 'TestLegacyPythonBridgeAndGoQualityContract' internal/marketdata/normalize/quality_parity_test.go
          echo 'Legacy unknown-quality markers and parity report are present.'
