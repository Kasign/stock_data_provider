name: WebUI browser smoke

on:
  pull_request:
    branches:
      - feat/full-go-data-providers-api-switch
    paths:
      - "web/**"
      - ".github/workflows/webui-browser-smoke.yml"
  push:
    branches:
      - feat/webui-market-data-console
      - feat/full-go-data-providers-api-switch
    paths:
      - "web/**"
      - ".github/workflows/webui-browser-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    name: Chromium responsive layout checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        working-directory: web
        run: npm install --no-save --no-package-lock playwright

      - name: Install Chromium
        working-directory: web
        run: npx playwright install chromium

      - name: Run responsive browser smoke tests
        working-directory: web
        run: node tests/browser-smoke.mjs

      - name: Run Run Flow interaction acceptance
        working-directory: web
        run: node tests/run-flow-browser.mjs

      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webui-browser-screenshots
          path: browser-screenshots/*.png
          if-no-files-found: warn
          retention-days: 7
