name: WebUI browser smoke

on:
  pull_request:
    branches:
      - feat/full-go-data-providers-api-switch
    paths:
      - "web/**"
      - ".github/workflows/webui-browser-smoke.yml"
  push:
    branches:
      - feat/webui-market-data-console
      - feat/full-go-data-providers-api-switch
    paths:
      - "web/**"
      - ".github/workflows/webui-browser-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    name: Chromium responsive layout checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        working-directory: web
        run: npm install --no-save --no-package-lock playwright postcss postcss-selector-parser

      - name: Install Chromium
        working-directory: web
        run: npx playwright install chromium

      - name: Run responsive browser smoke tests
        working-directory: web
        run: node tests/browser-smoke.mjs

      - name: Analyze CSS cascade structure with PostCSS
        working-directory: web
        run: node tests/css-structure-review.mjs

      - name: Capture Screening CSSOM computed-style baseline
        working-directory: web
        run: node tests/cssom-baseline.mjs

      - name: Run settings cross-tab synchronization acceptance
        working-directory: web
        run: node tests/settings-storage-browser.mjs

      - name: Run research records cross-tab synchronization acceptance
        working-directory: web
        run: node tests/research-records-cross-tab-browser.mjs

      - name: Run alerts and notification preferences cross-tab synchronization acceptance
        working-directory: web
        run: node tests/alerts-notifications-cross-tab-browser.mjs

      - name: Run watchlist quote snapshot acceptance
        working-directory: web
        run: node tests/watchlist-quotes-browser.mjs

      - name: Run Run Flow interaction acceptance
        working-directory: web
        run: node tests/run-flow-browser.mjs

      - name: Run Run Flow outcome and recovery acceptance
        working-directory: web
        run: node tests/run-flow-outcomes-browser.mjs

      - name: Run Stock Research interaction acceptance
        working-directory: web
        run: node tests/stock-research-browser.mjs

      - name: Run Stock Research data quality acceptance
        working-directory: web
        run: node tests/stock-research-data-browser.mjs

      - name: Run Data Center Provider probe acceptance
        working-directory: web
        run: node tests/data-center-probe-browser.mjs

      - name: Run local screening interaction acceptance
        working-directory: web
        run: node tests/screening-local-browser.mjs

      - name: Run market stocks pagination lifecycle acceptance
        working-directory: web
        run: node tests/market-stocks-lifecycle-browser.mjs

      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webui-browser-screenshots
          path: browser-screenshots/**/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Upload CSSOM computed-style baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webui-cssom-baseline
          path: browser-cssom-baseline/screening-local-batch.json
          if-no-files-found: warn
          retention-days: 30
