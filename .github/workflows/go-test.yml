name: Go test suite

on:
  pull_request:
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'cmd/**'
      - 'internal/**'
      - 'go-core/**'
      - 'services/market-data/**'
      - '.github/workflows/go-test.yml'
  push:
    branches: [main]
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'cmd/**'
      - 'internal/**'
      - 'go-core/**'
      - 'services/market-data/**'
      - '.github/workflows/go-test.yml'

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - .
          - go-core
          - services/market-data
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Check gofmt
        working-directory: ${{ matrix.module }}
        run: |
          files="$(gofmt -l ./cmd ./internal)"
          if [[ -n "$files" ]]; then
            echo "::error::Go files need gofmt:"
            printf '%s\n' "$files"
            exit 1
          fi
      - name: Download dependencies
        working-directory: ${{ matrix.module }}
        run: go mod download
      - name: Run tests
        working-directory: ${{ matrix.module }}
        run: go test ./...
      - name: Run race detector
        working-directory: ${{ matrix.module }}
        run: go test -race ./...
      - name: Run go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
