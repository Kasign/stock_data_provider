name: Go test suite

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'cmd/**'
      - 'internal/**'
      - 'doc/news/**'
      - 'go-core/**'
      - 'services/market-data/**'
      - '.github/workflows/go-test.yml'
      - '.env.example'
      - '.dockerignore'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'scripts/**'
  push:
    branches: [main, feat/full-go-data-providers-api-switch, feat/research-news-ingestion]
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'cmd/**'
      - 'internal/**'
      - 'doc/news/**'
      - 'go-core/**'
      - 'services/market-data/**'
      - '.github/workflows/go-test.yml'
      - '.env.example'
      - '.dockerignore'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'scripts/**'

permissions:
  contents: read

concurrency:
  group: go-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - .
          - go-core
          - services/market-data
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify legacy Go module paths in source and build configuration
        run: |
          if grep -R -nE 'github\\.com/ZhuLinsen/daily_stock_analysis/(go-core|services/market-data)' \
            --include='*.go' --include='go.mod' --include='Dockerfile' \
            --include='*.yml' --include='*.yaml' --include='*.sh' --include='Makefile' .; then
            echo "::error::发现旧 Go 模块路径残留"
            exit 1
          fi
          grep -Fxq 'module github.com/Kasign/stock_data_provider/go-core' go-core/go.mod
          grep -Fxq 'module github.com/Kasign/stock_data_provider/services/market-data' services/market-data/go.mod
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Check gofmt
        working-directory: ${{ matrix.module }}
        run: |
          files="$(gofmt -l ./cmd ./internal)"
          if [[ -n "$files" ]]; then
            echo "::error::Go files need gofmt:"
            printf '%s\n' "$files"
            while IFS= read -r file; do
              [[ -n "$file" ]] && gofmt -d "$file"
            done <<< "$files"
            exit 1
          fi
      - name: Download dependencies
        working-directory: ${{ matrix.module }}
        run: go mod download
      - name: Run tests
        working-directory: ${{ matrix.module }}
        run: go test ./...
      - name: Run race detector
        working-directory: ${{ matrix.module }}
        run: go test -race ./...
      - name: Run go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

  market-data-mariadb-integration:
    name: Market-data MariaDB migration and PIT persistence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: market-data-ci
          MARIADB_DATABASE: market_data_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: services/market-data/go.sum
      - name: Run MariaDB migration and PIT persistence integration
        working-directory: services/market-data
        env:
          MARKET_DATA_TEST_MYSQL_DSN: "root:market-data-ci@tcp(127.0.0.1:3306)/market_data_test?parseTime=true&loc=UTC"
        run: go test ./internal/repository -run TestMariaDBRevisionPersistenceAndPointInTimeQueries -count=1 -v
      - name: Run DataService MariaDB daily-bar fallback integration
        working-directory: services/market-data
        env:
          MARKET_DATA_TEST_MYSQL_DSN: "root:market-data-ci@tcp(127.0.0.1:3306)/market_data_test?parseTime=true&loc=UTC"
        run: go test ./internal/service -run TestDailyBarsMariaDBFallbackPreservesNormalizationWarnings -count=1 -v
      - name: Run DataService PIT revision fallback integration
        working-directory: services/market-data
        env:
          MARKET_DATA_TEST_MYSQL_DSN: "root:market-data-ci@tcp(127.0.0.1:3306)/market_data_test?parseTime=true&loc=UTC"
        run: go test ./internal/service -run 'Test(AdjustmentFactors|CorporateActions)AsOfFallsBackToLatestProviderVisibleRevision' -count=1 -v
      - name: Run Probe HTTP and MariaDB end-to-end integration
        working-directory: services/market-data
        env:
          MARKET_DATA_TEST_MYSQL_DSN: "root:market-data-ci@tcp(127.0.0.1:3306)/market_data_test?parseTime=true&loc=UTC"
        run: go test ./internal/httpapi -run TestProviderProbeHTTPMariaDBEndToEnd -count=1 -v

  news-mariadb-integration:
    name: News MariaDB Repository and Migration integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: news-ci
          MARIADB_DATABASE: news_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Run News MariaDB migration and repository integration
        env:
          NEWS_MARIADB_TEST_DSN: "root:news-ci@tcp(127.0.0.1:3306)/news_test?parseTime=true&loc=UTC"
        run: go test ./internal/news/adapters/storage -run TestNewsMariaDBRepositoryIntegration -count=1 -v

  container-build:
    name: Validate Compose and build Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Prepare example environment file
        run: cp .env.example .env
      - name: Validate Docker Compose configuration
        run: docker compose --env-file .env -f docker-compose.yml config --quiet
      - name: Check deploy script syntax
        run: bash -n scripts/deploy-go.sh
      - name: Build Go market-data image
        run: docker build --tag stock-analysis-data:ci --file services/market-data/Dockerfile services/market-data
      - name: Build Go analysis API image
        if: ${{ !cancelled() }}
        run: docker build --tag stock-analysis-server:ci --file Dockerfile .
