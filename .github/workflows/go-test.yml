name: Go test suite

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'cmd/**'
      - 'internal/**'
      - 'doc/news/**'
      - 'doc/api/contracts/**'
      - 'doc/整体任务规划/04-架构方案/Python能力盘点与Go迁移映射.md'
      - 'doc/整体任务规划/06-联调收尾/RepairAll跨模块修复计划与进度.md'
      - 'doc/notification/**'
      - 'doc/research/**'
      - 'doc/researchflow/**'
      - '.github/workflows/go-test.yml'
      - '.env.example'
      - '.dockerignore'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'scripts/**'
  push:
    branches: [main, repair_all, feat/data, feat/news, feat/llm, feat/notification, feat/quant, feat/research, feat/researchflow]
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'cmd/**'
      - 'internal/**'
      - 'doc/news/**'
      - 'doc/api/contracts/**'
      - 'doc/整体任务规划/04-架构方案/Python能力盘点与Go迁移映射.md'
      - 'doc/整体任务规划/06-联调收尾/RepairAll跨模块修复计划与进度.md'
      - 'doc/notification/**'
      - 'doc/research/**'
      - '.github/workflows/go-test.yml'
      - '.env.example'
      - '.dockerignore'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'scripts/**'

permissions:
  contents: read

concurrency:
  group: go-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test root Go module
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify retired legacy Go module paths are absent
        run: |
          if grep -R -nE 'github\\.com/ZhuLinsen/daily_stock_analysis/(go-core|services/market-data)' --exclude-dir=.git --exclude=go-test.yml --include='*.go' --include='go.mod' --include='Dockerfile' --include='*.yml' --include='*.yaml' --include='*.sh' --include='Makefile' .; then
            echo "::error::发现旧 Go 模块路径残留"
            exit 1
          fi
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Check gofmt
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/feat/server" && "$PWD" == "$GITHUB_WORKSPACE" ]]; then
            files="$(gofmt -l ./cmd/analysis-api ./internal/server)"
          else
            files="$(gofmt -l ./cmd ./internal)"
          fi
          if [[ -n "$files" ]]; then
            echo "::error::Go files need gofmt:"
            printf '%s\n' "$files"
            while IFS= read -r file; do
              [[ -n "$file" ]] && gofmt -d "$file"
            done <<< "$files"
            exit 1
          fi
      - name: Download dependencies
        run: go mod download
      - name: Run tests
        run: go test ./...
      - name: Run race detector
        run: go test -race ./...
      - name: Run go vet
        run: go vet ./...

  market-data-module-test:
    timeout-minutes: 20
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/data') || (github.event_name == 'push' && (github.ref == 'refs/heads/feat/data' || github.ref == 'refs/heads/repair_all')) }}
    name: Test Market Data in root module
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Check Market Data gofmt
        run: |
          files="$(gofmt -l ./internal/marketdata)"
          if [[ -n "$files" ]]; then
            printf '%s\n' "$files"
            exit 1
          fi
      - name: Run Market Data tests
        run: go test ./internal/marketdata/...
      - name: Run Market Data race detector
        run: go test -race ./internal/marketdata/...
      - name: Run Market Data vet
        run: go vet ./internal/marketdata/...

  market-data-mariadb-integration:
    if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/feat/data' || github.ref == 'refs/heads/repair_all' }}
    name: Market-data MariaDB migration and PIT persistence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: market-data-ci
          MARIADB_DATABASE: market_data_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: go.sum
      - name: Run MariaDB migration and PIT persistence integration
        env:
          MARKET_DATA_TEST_MYSQL_DSN: "root:market-data-ci@tcp(127.0.0.1:3306)/market_data_test?parseTime=true&loc=UTC"
        run: go test ./internal/marketdata/repository -run 'TestMariaDBRevisionPersistenceAndPointInTimeQueries|TestMariaDBDailyBarsCloseSeriesSnapshotIsImmutableAndVerifiable|TestMariaDBDataAuthorizationPolicyVersionsAreImmutableAndCurrent' -count=1 -v
      - name: Run DataService MariaDB daily-bar fallback integration
        env:
          MARKET_DATA_TEST_MYSQL_DSN: "root:market-data-ci@tcp(127.0.0.1:3306)/market_data_test?parseTime=true&loc=UTC"
        run: go test ./internal/marketdata/service -run TestDailyBarsMariaDBFallbackPreservesNormalizationWarnings -count=1 -v
      - name: Run DataService PIT revision fallback integration
        env:
          MARKET_DATA_TEST_MYSQL_DSN: "root:market-data-ci@tcp(127.0.0.1:3306)/market_data_test?parseTime=true&loc=UTC"
        run: go test ./internal/marketdata/service -run 'Test(AdjustmentFactors|CorporateActions)AsOfFallsBackToLatestProviderVisibleRevision' -count=1 -v
      - name: Run Fundamentals HTTP and MariaDB PIT end-to-end integration
        env:
          MARKET_DATA_TEST_MYSQL_DSN: "root:market-data-ci@tcp(127.0.0.1:3306)/market_data_test?parseTime=true&loc=UTC"
        run: go test ./internal/marketdata/httpapi -run TestFundamentalsHTTPToMariaDBPointInTime -count=1 -v
      - name: Run immutable DailyBar metadata MariaDB integration
        env:
          MARKET_DATA_TEST_MYSQL_DSN: "root:market-data-ci@tcp(127.0.0.1:3306)/market_data_test?parseTime=true&loc=UTC"
        run: go test ./internal/marketdata/repository -run '^TestMariaDBDailyBarExactValuesPersistAcrossCurrentAndPITReads$' -count=1 -v
      - name: Run immutable trading-calendar MariaDB repository integration
        env:
          MARKET_DATA_TEST_MYSQL_DSN: "root:market-data-ci@tcp(127.0.0.1:3306)/market_data_test?parseTime=true&loc=UTC"
        run: go test ./internal/marketdata/repository -run '^TestMariaDBTradingCalendarSnapshot' -count=1 -v
      - name: Run immutable limit-pool facts MariaDB integration
        env:
          MARKET_DATA_TEST_MYSQL_DSN: "root:market-data-ci@tcp(127.0.0.1:3306)/market_data_test?parseTime=true&loc=UTC"
        run: |
          set -o pipefail
          go test ./internal/marketdata/repository -run '^TestMariaDBLimitPoolFactsSnapshotRoundTripAndExactReuse$' -count=1 -v 2>&1 | tee /tmp/limit_pool_facts.log
          grep -Fq -- '--- PASS: TestMariaDBLimitPoolFactsSnapshotRoundTripAndExactReuse (' /tmp/limit_pool_facts.log
      - name: Run trading-calendar service MariaDB integration
        env:
          MARKET_DATA_TEST_MYSQL_DSN: "root:market-data-ci@tcp(127.0.0.1:3306)/market_data_test?parseTime=true&loc=UTC"
        run: go test ./internal/marketdata/service -run '^TestTradingCalendar' -count=1 -v
      - name: Run Probe HTTP and MariaDB end-to-end integration
        env:
          MARKET_DATA_TEST_MYSQL_DSN: "root:market-data-ci@tcp(127.0.0.1:3306)/market_data_test?parseTime=true&loc=UTC"
        run: go test ./internal/marketdata/httpapi -run TestProviderProbeHTTPMariaDBEndToEnd -count=1 -v

  news-mariadb-integration:
    if: ${{ github.event_name != 'push' || github.ref == 'refs/heads/feat/news' || github.ref == 'refs/heads/repair_all' }}
    name: News MariaDB Repository and Migration integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: news-ci
          MARIADB_DATABASE: news_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Diagnose root module dependency drift
        run: |
          set +e
          go mod tidy -diff > /tmp/go-mod-tidy.diff 2>&1
          status=$?
          cat /tmp/go-mod-tidy.diff
          echo "go mod tidy -diff exit code: $status"
          exit 0
      - name: Run News MariaDB migration, Application and repository integration
        env:
          NEWS_MARIADB_TEST_DSN: "root:news-ci@tcp(127.0.0.1:3306)/news_test?parseTime=true&loc=UTC"
        run: |
          go test ./internal/news/adapters/storage -run 'TestNewsMariaDBApplicationIntegration|TestNewsMariaDBPhysicalSchemaMatchesMigrationBaseline|TestObservationRetentionPurgeIntegration|TestNewsAvailabilityPITResolverMariaDBIntegration|TestAppendAvailabilityDecisionSerializesConcurrentWritersMariaDBIntegration|TestAvailabilityEvidenceWriteRequiresCurrentFieldPolicyMariaDBIntegration|TestResolveCurrentSourceCollectionPoliciesMariaDBIntegration|TestNewsPolicyVersionPointerCASMariaDBIntegration' -count=1 -v

      - name: Run News Feed Application and MariaDB Stage integration
        env:
          NEWS_MARIADB_TEST_DSN: "root:news-ci@tcp(127.0.0.1:3306)/news_test?parseTime=true&loc=UTC"
        run: |
          set -o pipefail
          go test ./internal/news/stage -run '^TestNewsFeedCollectionAdapterMariaDBIntegration$|^TestNewsAvailabilityProductionChainMariaDBIntegration$' -count=1 -v 2>&1 | tee /tmp/news_feed_stage.log
          grep -Fq -- '--- PASS: TestNewsFeedCollectionAdapterMariaDBIntegration (' /tmp/news_feed_stage.log
          grep -Fq -- '--- PASS: TestNewsAvailabilityProductionChainMariaDBIntegration (' /tmp/news_feed_stage.log
      - name: Run News Feed Server and Researchflow composition MariaDB integration
        env:
          NEWS_MARIADB_TEST_DSN: "root:news-ci@tcp(127.0.0.1:3306)/news_test?parseTime=true&loc=UTC"
        run: |
          set -o pipefail
          go test ./internal/server/bootstrap -run '^TestNewsFeedStageCompositionMariaDBPublishesOnlyExplicitForwardPolicyTransitions$' -count=1 -v 2>&1 | tee /tmp/news_feed_composition.log
          grep -Fq -- '--- PASS: TestNewsFeedStageCompositionMariaDBPublishesOnlyExplicitForwardPolicyTransitions (' /tmp/news_feed_composition.log
  research-module-validation:
    name: Research module format, tests, race and vet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
          cache-dependency-path: go.sum
      - name: Check Research gofmt
        run: |
          files="$(gofmt -l ./internal/research)"
          if [[ -n "$files" ]]; then
            echo "::error::Research Go files need gofmt:"
            printf '%s\\n' "$files"
            while IFS= read -r file; do
              [[ -z "$file" ]] || gofmt -d "$file"
            done <<< "$files"
            exit 1
          fi
      - name: Download dependencies
        run: go mod download
      - name: Run Research tests
        run: go test ./internal/research/...
      - name: Run Research race detector
        run: go test -race ./internal/research/...
      - name: Run Research go vet
        run: go vet ./internal/research/...

  research-mariadb-integration:
    name: Research MariaDB migration and repository integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: research-ci
          MARIADB_DATABASE: research_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
          cache-dependency-path: go.sum
      - name: Run Research MariaDB integration
        env:
          RESEARCH_TEST_MYSQL_DSN: "root:research-ci@tcp(127.0.0.1:3306)/research_test?parseTime=true&loc=UTC"
        run: go test ./internal/research/storage -run '^TestResearch' -count=1 -v

  researchflow-module-validation:
    name: Researchflow module format, tests, race and vet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: go.sum
      - name: Check Researchflow gofmt
        run: |
          files="$(gofmt -l ./internal/researchflow)"
          if [[ -n "$files" ]]; then
            echo "::error::Researchflow Go files need gofmt:"
            printf '%s\n' "$files"
            while IFS= read -r file; do
              [[ -z "$file" ]] || gofmt -d "$file"
            done <<< "$files"
            exit 1
          fi
      - name: Download dependencies
        run: go mod download
      - name: Run Researchflow tests
        run: go test ./internal/researchflow/...
      - name: Run Researchflow race detector
        run: go test -race ./internal/researchflow/...
      - name: Run Researchflow go vet
        run: go vet ./internal/researchflow/...

  researchflow-workerstore-validation:
    name: Researchflow WorkerStore unit, race and vet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: go.sum
      - name: Download dependencies
        run: go mod download
      - name: Run WorkerStore storage tests
        run: go test ./internal/researchflow/storage
      - name: Run WorkerStore storage race detector
        run: go test -race ./internal/researchflow/storage
      - name: Run WorkerStore storage go vet
        run: go vet ./internal/researchflow/storage

  notification-mariadb-integration:
    name: Notification MariaDB lifecycle integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: notification-ci
          MARIADB_DATABASE: notification_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: go.sum
      - name: Run Notification MariaDB lifecycle integration
        env:
          NOTIFICATION_MARIADB_TEST_DSN: "root:notification-ci@tcp(127.0.0.1:3306)/notification_test?parseTime=true&loc=UTC"
        run: go test ./internal/notification/storage -run '^TestNotificationMariaDB' -count=1 -v
      - name: Run Notification MariaDB lifecycle race integration
        env:
          NOTIFICATION_MARIADB_TEST_DSN: "root:notification-ci@tcp(127.0.0.1:3306)/notification_test?parseTime=true&loc=UTC"
        run: go test -race ./internal/notification/storage -run '^TestNotificationMariaDB' -count=1 -v

  researchflow-mariadb-integration:
    name: Researchflow MariaDB lifecycle integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: researchflow-ci
          MARIADB_DATABASE: researchflow_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      PLATFORM_STORAGE_INTEGRATION: "1"
      PLATFORM_MARIADB_ADDR: 127.0.0.1:3306
      PLATFORM_MARIADB_USER: root
      PLATFORM_MARIADB_PASSWORD: researchflow-ci
      PLATFORM_MARIADB_DATABASE: researchflow_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: go.sum
      - name: Run Researchflow MariaDB lifecycle integration
        run: go test ./internal/researchflow/storage -run '^TestMariaDB' -count=1 -v
      - name: Run Researchflow MariaDB lifecycle race integration
        run: go test -race ./internal/researchflow/storage -run '^TestMariaDB' -count=1 -v

  container-build:
    if: ${{ github.ref == 'refs/heads/integration' || github.ref == 'refs/heads/repair_all' || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'integration') }}
    name: Validate Compose and build Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Prepare example environment file
        run: cp .env.example .env
      - name: Validate Docker Compose configuration
        env:
          OWNER_SESSION_PUBLIC_ORIGIN: https://localhost
          OWNER_SESSION_ARGON2_MEMORY_KIB: "65536"
          OWNER_SESSION_ARGON2_ITERATIONS: "3"
          OWNER_SESSION_ARGON2_PARALLELISM: "1"
        run: docker compose --env-file .env -f docker-compose.yml config --quiet
      - name: Check deploy script syntax
        run: bash -n scripts/deploy-go.sh
      - name: Build Go analysis API image
        if: ${{ !cancelled() }}
        run: docker build --tag stock-analysis-server:ci --file Dockerfile .
