name: Go test suite

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'cmd/**'
      - 'internal/**'
      - 'doc/news/**'
      - 'doc/notification/**'
      - 'go-core/**'
      - 'services/market-data/**'
      - '.github/workflows/go-test.yml'
      - '.env.example'
      - '.dockerignore'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'scripts/**'
  push:
    branches: [main, feat/full-go-data-providers-api-switch, feat/research-news-ingestion, feat/notification, feat/quant]
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'cmd/**'
      - 'internal/**'
      - 'doc/news/**'
      - 'doc/notification/**'
      - 'go-core/**'
      - 'services/market-data/**'
      - '.github/workflows/go-test.yml'
      - '.env.example'
      - '.dockerignore'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'scripts/**'

permissions:
  contents: read

concurrency:
  group: go-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  migrate-market-data-module:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feat/full-go-data-providers-api-switch' }}
    name: Migrate Market Data into root Go module
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    outputs:
      migration_committed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Check out Data migration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          repository: ${{ github.repository }}
          fetch-depth: 0
      - name: Run one-time source migration
        run: bash scripts/migrate-market-data-module.sh
      - name: Tidy root Go module dependencies
        run: |
          go mod tidy
          git add go.mod go.sum
      - name: Format Data Application Port
        run: |
          gofmt -w ./internal/marketdata/app ./internal/marketdata/application ./internal/marketdata/bootstrap ./cmd/market-data
          git add internal/marketdata/app internal/marketdata/application internal/marketdata/bootstrap cmd/market-data
      - name: Commit and push migration
        id: commit
        run: |
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No migration changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(api): 整理 Data 模块迁移与根模块依赖"
          git push origin HEAD:refs/heads/feat/full-go-data-providers-api-switch
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Trigger validation for migrated commit
        if: ${{ steps.commit.outputs.changed == 'true' || github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run go-test.yml --ref feat/full-go-data-providers-api-switch

  test:
    name: Test ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - .
          - go-core
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify legacy Go module paths in source and build configuration
        run: |
          if grep -R -nE 'github\\.com/ZhuLinsen/daily_stock_analysis/(go-core|services/market-data)' \\
            --include='*.go' --include='go.mod' --include='Dockerfile' \\
            --include='*.yml' --include='*.yaml' --include='*.sh' --include='Makefile' .; then
            echo "::error::发现旧 Go 模块路径残留"
            exit 1
          fi
          grep -Fxq 'module github.com/Kasign/stock_data_provider/go-core' go-core/go.mod
          if [[ -f services/market-data/go.mod ]]; then
            grep -Fxq 'module github.com/Kasign/stock_data_provider/services/market-data' services/market-data/go.mod
          else
            test ! -d services/market-data/internal
          fi
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Check gofmt
        working-directory: ${{ matrix.module }}
        run: |
          files="$(gofmt -l ./cmd ./internal)"
          if [[ -n "$files" ]]; then
            echo "::error::Go files need gofmt:"
            printf '%s\\n' "$files"
            while IFS= read -r file; do
              [[ -n "$file" ]] && gofmt -d "$file"
            done <<< "$files"
            exit 1
          fi
      - name: Download dependencies
        working-directory: ${{ matrix.module }}
        run: go mod download
      - name: Run tests
        working-directory: ${{ matrix.module }}
        run: go test ./...
      - name: Run race detector
        working-directory: ${{ matrix.module }}
        run: go test -race ./...
      - name: Run go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

  market-data-module-test:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/full-go-data-providers-api-switch') }}
    name: Test Market Data in root module
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Check Market Data gofmt
        run: |
          files="$(gofmt -l ./internal/marketdata ./cmd/market-data)"
          if [[ -n "$files" ]]; then
            printf '%s\n' "$files"
            exit 1
          fi
      - name: Run Market Data tests
        run: go test ./internal/marketdata/... ./cmd/market-data/...
      - name: Run Market Data race detector
        run: go test -race ./internal/marketdata/... ./cmd/market-data/...
      - name: Run Market Data vet
        run: go vet ./internal/marketdata/... ./cmd/market-data/...

  market-data-mariadb-integration:
    if: ${{ github.event_name != 'push' }}
    name: Market-data MariaDB migration and PIT persistence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: market-data-ci
          MARIADB_DATABASE: market_data_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: go.sum
      - name: Run MariaDB migration and PIT persistence integration
        env:
          MARKET_DATA_TEST_MYSQL_DSN: "root:market-data-ci@tcp(127.0.0.1:3306)/market_data_test?parseTime=true&loc=UTC"
        run: |
          if [[ -f services/market-data/go.mod ]]; then
            (cd services/market-data && go test ./internal/repository -run TestMariaDBRevisionPersistenceAndPointInTimeQueries -count=1 -v)
          else
            go test ./internal/marketdata/repository -run TestMariaDBRevisionPersistenceAndPointInTimeQueries -count=1 -v
          fi
      - name: Run DataService MariaDB daily-bar fallback integration
        env:
          MARKET_DATA_TEST_MYSQL_DSN: "root:market-data-ci@tcp(127.0.0.1:3306)/market_data_test?parseTime=true&loc=UTC"
        run: |
          if [[ -f services/market-data/go.mod ]]; then
            (cd services/market-data && go test ./internal/service -run TestDailyBarsMariaDBFallbackPreservesNormalizationWarnings -count=1 -v)
          else
            go test ./internal/marketdata/service -run TestDailyBarsMariaDBFallbackPreservesNormalizationWarnings -count=1 -v
          fi
      - name: Run DataService PIT revision fallback integration
        env:
          MARKET_DATA_TEST_MYSQL_DSN: "root:market-data-ci@tcp(127.0.0.1:3306)/market_data_test?parseTime=true&loc=UTC"
        run: |
          if [[ -f services/market-data/go.mod ]]; then
            (cd services/market-data && go test ./internal/service -run 'Test(AdjustmentFactors|CorporateActions)AsOfFallsBackToLatestProviderVisibleRevision' -count=1 -v)
          else
            go test ./internal/marketdata/service -run 'Test(AdjustmentFactors|CorporateActions)AsOfFallsBackToLatestProviderVisibleRevision' -count=1 -v
          fi
      - name: Run Probe HTTP and MariaDB end-to-end integration
        env:
          MARKET_DATA_TEST_MYSQL_DSN: "root:market-data-ci@tcp(127.0.0.1:3306)/market_data_test?parseTime=true&loc=UTC"
        run: |
          if [[ -f services/market-data/go.mod ]]; then
            (cd services/market-data && go test ./internal/httpapi -run TestProviderProbeHTTPMariaDBEndToEnd -count=1 -v)
          else
            go test ./internal/marketdata/httpapi -run TestProviderProbeHTTPMariaDBEndToEnd -count=1 -v
          fi

  news-mariadb-integration:
    if: ${{ github.event_name != 'push' }}
    name: News MariaDB Repository and Migration integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: news-ci
          MARIADB_DATABASE: news_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Diagnose root module dependency drift
        run: |
          set +e
          go mod tidy -diff > /tmp/go-mod-tidy.diff 2>&1
          status=$?
          cat /tmp/go-mod-tidy.diff
          echo "go mod tidy -diff exit code: $status"
          exit 0
      - name: Run News MariaDB migration and repository integration
        env:
          NEWS_MARIADB_TEST_DSN: "root:news-ci@tcp(127.0.0.1:3306)/news_test?parseTime=true&loc=UTC"
        run: go test ./internal/news/adapters/storage -run TestNewsMariaDBRepositoryIntegration -count=1 -v

  container-build:
    if: ${{ github.ref == 'refs/heads/integration' || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'integration') }}
    name: Validate Compose and build Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Prepare example environment file
        run: cp .env.example .env
      - name: Validate Docker Compose configuration
        run: docker compose --env-file .env -f docker-compose.yml config --quiet
      - name: Check deploy script syntax
        run: bash -n scripts/deploy-go.sh
      - name: Build Go market-data image
        run: |
          if [[ -f services/market-data/go.mod ]]; then
            docker build --tag stock-analysis-data:ci --file services/market-data/Dockerfile services/market-data
          else
            docker build --tag stock-analysis-data:ci --file services/market-data/Dockerfile .
          fi
      - name: Build Go analysis API image
        if: ${{ !cancelled() }}
        run: docker build --tag stock-analysis-server:ci --file Dockerfile .
