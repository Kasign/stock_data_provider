name: Integration CI

on:
  push:
    branches:
      - integration
    paths:
      - '*.go'
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'go-core/go.mod'
      - 'go-core/go.sum'
      - 'web/**'
      - 'docker-compose.yml'
      - '.env.example'
      - '.github/workflows/integration-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-checks:
    name: Go format and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Check Go formatting
        shell: bash
        run: |
          files="$(git ls-files -z '*.go' | xargs -0 -r gofmt -l)"
          if [[ -n "$files" ]]; then
            echo "以下 Go 文件未通过 gofmt："
            echo "$files"
            exit 1
          fi

      - name: Run go vet (root module)
        run: go vet ./...

      - name: Run go vet (go-core module)
        working-directory: go-core
        run: go vet ./...

  webui-checks:
    name: WebUI checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare example environment
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose --env-file .env -f docker-compose.yml config --quiet

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript syntax
        working-directory: web
        run: npm run check

      - name: Run WebUI unit tests
        working-directory: web
        run: npm test

      - name: Build WebUI image
        run: docker build --tag stock-analysis-web:ci --file web/Dockerfile web
