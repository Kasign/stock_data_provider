# Single deployment entry point: Root Server hosts Data and all application modules in-process.
services:
  stock-analysis-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stock-analysis-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      OWNER_SESSION_ENABLED: "true"
      OWNER_SESSION_PUBLIC_ORIGIN: ${OWNER_SESSION_PUBLIC_ORIGIN:?Set the exact browser Origin used by the WebUI}
      OWNER_SESSION_COOKIE_NAME: ${OWNER_SESSION_COOKIE_NAME:-__Secure-owner_session}
      OWNER_SESSION_COOKIE_PATH: /api
      OWNER_SESSION_COOKIE_SECURE: ${OWNER_SESSION_COOKIE_SECURE:-true}
      OWNER_SESSION_CSRF_HEADER: X-CSRF-Token
      OWNER_SESSION_ARGON2_MEMORY_KIB: ${OWNER_SESSION_ARGON2_MEMORY_KIB:?Set benchmarked Argon2id memory cost}
      OWNER_SESSION_ARGON2_ITERATIONS: ${OWNER_SESSION_ARGON2_ITERATIONS:?Set benchmarked Argon2id iteration cost}
      OWNER_SESSION_ARGON2_PARALLELISM: ${OWNER_SESSION_ARGON2_PARALLELISM:?Set benchmarked Argon2id parallelism}
    ports:
      - "127.0.0.1:8092:8092"
    networks:
      - 1panel-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8092/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  stock-analysis-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: stock-analysis-web
    restart: unless-stopped
    ports:
      - "${WEBUI_BIND_ADDR:-127.0.0.1}:${WEBUI_PORT:-8093}:80"
    depends_on:
      stock-analysis-server:
        condition: service_healthy
    networks:
      - 1panel-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  1panel-network:
    external: true
