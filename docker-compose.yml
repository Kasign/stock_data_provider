# Unified deployment entry point for the Go APIs and WebUI.
services:
  stock-analysis-data:
    build:
      context: ./services/market-data
      dockerfile: Dockerfile
    container_name: stock-analysis-data
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MARKET_DATA_HTTP_ADDR: :8091
      MARKET_DATA_API_KEY: ${MARKET_DATA_API_KEY:?Set MARKET_DATA_API_KEY in .env to a random secret of at least 32 characters}
      MARKET_DATA_REDIS_ADDR: ${MARKET_DATA_REDIS_ADDR:?Set MARKET_DATA_REDIS_ADDR to the existing Redis service}
      MARKET_DATA_REDIS_PASSWORD: ${MARKET_DATA_REDIS_PASSWORD:-}
      MARKET_DATA_REDIS_DB: ${MARKET_DATA_REDIS_DB:-0}
      MARKET_DATA_DB_AUTO_MIGRATE: ${MARKET_DATA_DB_AUTO_MIGRATE:-true}
    expose:
      - "8091"
    networks:
      - 1panel-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8091/health/ready >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

  stock-analysis-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stock-analysis-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MARKET_DATA_BASE_URL: http://stock-analysis-data:8091
      MARKET_DATA_API_KEY: ${MARKET_DATA_API_KEY:?Set MARKET_DATA_API_KEY in .env to the same secret used by stock-analysis-data}
    depends_on:
      stock-analysis-data:
        condition: service_healthy
    ports:
      - "127.0.0.1:8092:8092"
    networks:
      - 1panel-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8092/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  stock-analysis-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: stock-analysis-web
    restart: unless-stopped
    ports:
      - "${WEBUI_BIND_ADDR:-127.0.0.1}:${WEBUI_PORT:-8093}:80"
    environment:
      MARKET_DATA_SERVICE_NAME: ${MARKET_DATA_SERVICE_NAME:-stock-analysis-data}
      ANALYSIS_SERVICE_NAME: ${ANALYSIS_SERVICE_NAME:-stock-analysis-server}
    depends_on:
      stock-analysis-data:
        condition: service_healthy
      stock-analysis-server:
        condition: service_healthy
    networks:
      - 1panel-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  1panel-network:
    external: true
