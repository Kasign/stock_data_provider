services:
  market-data:
    build:
      context: ./services/market-data
      dockerfile: Dockerfile
    container_name: stock-market-data
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MARKET_DATA_HTTP_ADDR: :8091
      MARKET_DATA_API_KEY: ${MARKET_DATA_API_KEY:?Set MARKET_DATA_API_KEY in .env to a random secret of at least 32 characters}
      MARKET_DATA_REDIS_ADDR: ${MARKET_DATA_REDIS_ADDR:?Set MARKET_DATA_REDIS_ADDR to the existing Redis service}
      MARKET_DATA_REDIS_PASSWORD: ${MARKET_DATA_REDIS_PASSWORD:-}
      MARKET_DATA_REDIS_DB: ${MARKET_DATA_REDIS_DB:-0}
      MARKET_DATA_DB_AUTO_MIGRATE: ${MARKET_DATA_DB_AUTO_MIGRATE:-true}
    expose:
      - "8091"
    networks:
      - 1panel-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8091/health/ready >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

  stock-analysis-go:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stock-analysis-go
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MARKET_DATA_BASE_URL: http://market-data:8091
      MARKET_DATA_API_KEY: ${MARKET_DATA_API_KEY:?Set MARKET_DATA_API_KEY in .env to the same secret used by market-data}
    depends_on:
      market-data:
        condition: service_healthy
    ports:
      - "127.0.0.1:8092:8092"
    networks:
      - 1panel-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8092/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  1panel-network:
    external: true
