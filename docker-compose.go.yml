services:
  stock-analysis-go:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stock-analysis-go
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "8092:8092"

    networks:
      - 1panel-network

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8092/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  1panel-network:
    external: true